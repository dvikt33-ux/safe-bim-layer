      note: "Do not infer insulation symbol from memory; verify project/SPDS convention."

  - name: FILL_21_BACKFILL
    status: blocked_visual_source
    source_basis:
      document: GOST_2_306_68
      figure: 1b
      note: "Backfill symbol must be visually reconstructed from authoritative figure."

release_gates:
  - exact_geometry_verified
  - tapir_readback_matches
  - scale_behavior_verified_at_1_100_1_50_1_20
  - pdf_print_verified
  - dwg_roundtrip_verified
