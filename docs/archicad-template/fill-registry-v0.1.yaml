  - name: FILL_16_GOST_CONCRETE
    status: blocked_visual_source
    source_basis: {document: GOST_2_306_68, table: 1, row: 6}

  - name: FILL_17_GOST_GLASS
    status: blocked_visual_source
    source_basis: {document: GOST_2_306_68, table: 1, row: 7}

  - name: FILL_18_GOST_LIQUID
    status: blocked_visual_source
    source_basis: {document: GOST_2_306_68, table: 1, row: 8}

  - name: FILL_19_GOST_SOIL
