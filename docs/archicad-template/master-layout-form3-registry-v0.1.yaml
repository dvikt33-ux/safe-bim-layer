archicad_mapping_policy:
  use_autotext_where_stable: true
  project_info_for_project_wide_fields: true
  layout_info_for_sheet_specific_fields: true
  revision_management_for_graphs_14_19: true
  signatures_never_faked: true
  missing_required_field_behavior: BLOCKED_ISSUE
  literal_manual_text_for_dynamic_fields_forbidden_by_default: true

automation:
  geometry:
    candidate_commands:
      - ChangeWindow
      - CreateLineElements
      - CreateTexts
    status: api_path_available_needs_live_masterlayout_test
  autotext:
    status: unresolved_api_behavior
    blocker: "CreateTexts exposes plain text content but Tapir 1.5.8 has no general AutoText token enumeration/insertion command."
  master_layout_creation:
    status: api_path_available_needs_live_test
    candidate_commands:
      - CreateLayout
      - GetNavigatorItemTree
      - GetDatabaseIdFromNavigatorItemId
      - ChangeWindow

release_gates:
  - form3_geometry_drawn_in_master_layout
  - A4_orientation_checked
  - A3_to_A0_orientation_checked
  - frame_offsets_checked
  - project_info_autotext_bindings_checked
  - sheet_number_and_count_autotext_checked
  - revision_fields_checked
  - PDF_print_100_percent_checked
