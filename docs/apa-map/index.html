<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>APA · Карта проекта</title><style>body{font:16px system-ui;background:#f3f1ec;color:#26313b;margin:0}main{max-width:850px;margin:auto;padding:20px}h1{margin-bottom:4px}p{line-height:1.5}.muted{color:#56606b}.bar{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}button,input{padding:12px;border:1px solid #aeb6bc;border-radius:7px;background:white;font:inherit}input{width:100%;box-sizing:border-box}details{background:#fff;border:1px solid #c9c9c4;border-radius:9px;margin:9px 0;padding:12px}details details{margin-left:10px;background:#f9f8f5}summary{cursor:pointer;font-weight:650;padding:4px;line-height:2}.tag{display:inline-block;border-radius:5px;padding:1px 9px;color:white;font-size:13px;font-weight:700;margin-left:6px}footer{font-size:13px;color:#56606b;margin-top:20px}</style></head><body><main><h1>APA · Карта проекта</h1><p class="muted">Рабочий реестр · R05 · 22.10.2026 · предварительные статусы</p><input id="q" placeholder="Поиск: Tapir, Rhino, нормативы…"><div class="bar"><button id="open">Раскрыть всё</button><button id="close">Свернуть всё</button></div><section id="tree"></section><footer>Статусы основаны на материалах исследования; не являются подтверждением испытаний в Archicad. Обновления вручную через GitHub, автоматическая синхронизация не настроена.</footer></main><script>const fallbackItems=[["Управление APA","В работе",["API и SceneWriter","GitHub и архив","Компилятор заданий"]],["Archicad и Tapir","Блокировано",["Навигация и поэтажное чтение","CreateSlabs и readback","BUILD-01"]],["Rhino и Grasshopper","Исследование",["Rhino 8","Grasshopper","Live Connection","Rhino.Compute"]],["Храмовый комплекс","Исследование",["Нормативы Д-04","Функции Д-05","Архитектура Д-06","Купола и своды"]],["Проверка и приёмка","Не принято",["SOURCE","OFFLINE","LIVE","ACCEPTED"]],["Документация","В работе",["Каталог инструментов","Карта APA","Журнал решений"]]];const colors={"Готово":"#24613E","В работе":"#245B84","Исследование":"#67507D","Не проверено":"#9A641B","Блокировано":"#963D3D","Не принято":"#963D3D","Запланировано":"#555E67"};const host=document.getElementById('tree');function render(items){host.replaceChildren();for(const [name,status,children] of items){const d=document.createElement('details');d.dataset.text=[name,status,...children].join(' ').toLowerCase();const s=document.createElement('summary');s.append(document.createTextNode(name+' '));const badge=document.createElement('span');badge.className='tag';badge.style.background=colors[status];badge.textContent=status;s.append(badge);d.append(s);for(const child of children){const x=document.createElement('details'),y=document.createElement('summary');y.textContent=child;x.append(y);const p=document.createElement('p');p.className='muted';p.textContent='Детали и доказательства требуют уточнения по журналу исследований.';x.append(p);d.append(x)}host.append(d)}}render(fallbackItems);fetch('./project.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(data=>render(data.sections.map(x=>[x.title,x.status,x.items]))).catch(()=>{});document.getElementById('open').onclick=()=>document.querySelectorAll('details').forEach(d=>d.open=true);document.getElementById('close').onclick=()=>document.querySelectorAll('details').forEach(d=>d.open=false);document.getElementById('q').oninput=e=>{const q=e.target.value.toLowerCase().trim();for(const d of host.children){d.hidden=!d.dataset.text.includes(q);if(q&&!d.hidden)d.open=true}};</script></body></html>
