<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="811" viewBox="0 0 1400 811"><rect width="1400" height="811" fill="#f6f7f9"/><text x="42" y="48" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#16202a">МОАГ — блоковая схема без масштаба</text><text x="42" y="83" font-family="Arial,sans-serif" font-size="17" fill="#334155">Три глобальных уровня и центральный объём; относительное размещение не реконструировано.</text><rect x="40" y="100" width="1320" height="40" rx="8" fill="#fff4d6" stroke="#d29b26"/><text x="56" y="126" font-family="Arial,sans-serif" font-size="15" fill="#684b00">Блоки не показывают реальное взаимное положение, внешний силуэт, размеры или число палуб.</text><rect x="40" y="145" width="430" height="423" rx="14" fill="#fff" stroke="#94a3b8"/><text x="58" y="175" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#1e293b">Первый / Нижний</text><rect x="54" y="191" width="402" height="70" rx="10" fill="#fef0dc" stroke="#8092a7"/><text x="68" y="216" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Район бывших баз спецподразделения</text><text x="68" y="239" font-family="Arial,sans-serif" font-size="12" fill="#475569">L1-BASES • B1-06, B2-01</text><rect x="54" y="275" width="402" height="70" rx="10" fill="#fef0dc" stroke="#8092a7"/><text x="68" y="300" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Ангарный сектор</text><text x="68" y="323" font-family="Arial,sans-serif" font-size="12" fill="#475569">L1-HANGAR-ZONE • B2-14</text><rect x="54" y="359" width="402" height="70" rx="10" fill="#fef0dc" stroke="#8092a7"/><text x="68" y="384" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Цех сортировки/переработки отходов</text><text x="68" y="407" font-family="Arial,sans-serif" font-size="12" fill="#475569">L1-RECYCLING • B1-06, B1-14</text><rect x="54" y="443" width="402" height="70" rx="10" fill="#fef0dc" stroke="#8092a7"/><text x="68" y="468" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Запечатанная/неисследованная часть</text><text x="68" y="491" font-family="Arial,sans-serif" font-size="12" fill="#475569">L1-SEALED • B1-06, B2-01</text><rect x="494" y="145" width="430" height="423" rx="14" fill="#fff" stroke="#94a3b8"/><text x="512" y="175" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#1e293b">Второй / Детский</text><rect x="508" y="191" width="402" height="70" rx="10" fill="#e4f3e8" stroke="#8092a7"/><text x="522" y="216" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Внутренняя Зелёная магистраль</text><text x="522" y="239" font-family="Arial,sans-serif" font-size="12" fill="#475569">L2-GREEN • B1-04</text><rect x="508" y="275" width="402" height="70" rx="10" fill="#e4f3e8" stroke="#8092a7"/><text x="522" y="300" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Оранжевая магистраль</text><text x="522" y="323" font-family="Arial,sans-serif" font-size="12" fill="#475569">L2-ORANGE • B1-04</text><rect x="508" y="359" width="402" height="70" rx="10" fill="#e4f3e8" stroke="#8092a7"/><text x="522" y="384" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Главная площадь</text><text x="522" y="407" font-family="Arial,sans-serif" font-size="12" fill="#475569">L2-PLAZA • B1-03, B1-04</text><rect x="508" y="443" width="402" height="70" rx="10" fill="#e4f3e8" stroke="#8092a7"/><text x="522" y="468" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Детский сад Второго уровня</text><text x="522" y="491" font-family="Arial,sans-serif" font-size="12" fill="#475569">L2-NURSERY • LR-B1-025</text><rect x="948" y="145" width="430" height="423" rx="14" fill="#fff" stroke="#94a3b8"/><text x="966" y="175" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#1e293b">Третий / Верхний</text><rect x="962" y="191" width="402" height="70" rx="10" fill="#e7e3fa" stroke="#8092a7"/><text x="976" y="216" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Капитанская рубка</text><text x="976" y="239" font-family="Arial,sans-serif" font-size="12" fill="#475569">L3-BRIDGE • B1-06</text><rect x="962" y="275" width="402" height="70" rx="10" fill="#e7e3fa" stroke="#8092a7"/><text x="976" y="300" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Детский блок / кувезы</text><text x="976" y="323" font-family="Arial,sans-serif" font-size="12" fill="#475569">L3-CHILD-LAB • B1-15</text><rect x="962" y="359" width="402" height="70" rx="10" fill="#e7e3fa" stroke="#8092a7"/><text x="976" y="384" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Производственные отсеки</text><text x="976" y="407" font-family="Arial,sans-serif" font-size="12" fill="#475569">L3-PRODUCTION • B1-06, B1-14</text><rect x="962" y="443" width="402" height="70" rx="10" fill="#e7e3fa" stroke="#8092a7"/><text x="976" y="468" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Шлюзы и ангары грузовых крейсеров</text><text x="976" y="491" font-family="Arial,sans-serif" font-size="12" fill="#475569">L3-DOCK • B1-14</text><rect x="962" y="527" width="402" height="70" rx="10" fill="#e7e3fa" stroke="#8092a7"/><text x="976" y="552" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Круглый центральный инженерный объем трёх уровней</text><text x="976" y="575" font-family="Arial,sans-serif" font-size="12" fill="#475569">CORE-ENERGY-SHAFT • LR-B2-034</text><rect x="40" y="583" width="1320" height="133" rx="12" fill="#fff" stroke="#94a3b8"/><text x="58" y="610" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#1e293b">Явные отношения исходного графа</text><text x="60" y="637" font-family="Arial,sans-serif" font-size="13" fill="#334155">E159: CORE-ENERGY-SHAFT —[vertical_extent_in_level_no_access_proven]→ L1 • Центральный объём охватывает Нижний уровень; прямая дверь на этот уровень из центральной шахты пока не доказана.</text><text x="60" y="663" font-family="Arial,sans-serif" font-size="13" fill="#334155">E160: CORE-ENERGY-SHAFT —[vertical_extent_in_level_no_access_proven]→ L2 • Центральный объём охватывает Второй уровень; наличие доступного выхода из шахты на Второй не доказано.</text><text x="60" y="689" font-family="Arial,sans-serif" font-size="13" fill="#334155">E161: CORE-ENERGY-SHAFT —[vertical_extent_in_level_no_access_proven]→ L3 • Центральный объём выходит на Третий уровень; подтверждена галерея с отдельным запираемым входом.</text><text x="42" y="786" font-family="Arial,sans-serif" font-size="13" fill="#475569">Полный периметр стен, размеры, XY, азимуты и высоты палуб: неизвестны • MOAG / SHIP-MLP-MOAG-001</text></svg>