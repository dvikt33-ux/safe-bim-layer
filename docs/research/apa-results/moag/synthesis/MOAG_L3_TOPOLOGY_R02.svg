<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1233" viewBox="0 0 1400 1233"><rect width="1400" height="1233" fill="#f6f7f9"/><text x="42" y="48" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#16202a">МОАГ — Третий / Верхний уровень</text><text x="42" y="83" font-family="Arial,sans-serif" font-size="17" fill="#334155">Кольца, рубка, детский блок, логистика и производство.</text><rect x="40" y="100" width="1320" height="40" rx="8" fill="#fff4d6" stroke="#d29b26"/><text x="56" y="126" font-family="Arial,sans-serif" font-size="15" fill="#684b00">Схема отношений; не план в масштабе. Позиции карточек не задают координаты, расстояния или ориентацию.</text><rect x="40" y="145" width="430" height="507" rx="14" fill="#fff" stroke="#94a3b8"/><text x="58" y="175" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#1e293b">Кольцевая структура</text><rect x="54" y="191" width="402" height="70" rx="10" fill="#e2ecf7" stroke="#8092a7"/><text x="68" y="216" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Третий / верхний уровень</text><text x="68" y="239" font-family="Arial,sans-serif" font-size="12" fill="#475569">L3 • B1-06, B1-15</text><rect x="54" y="275" width="402" height="70" rx="10" fill="#e2ecf7" stroke="#8092a7"/><text x="68" y="300" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Внутренний круг Верхнего уровня</text><text x="68" y="323" font-family="Arial,sans-serif" font-size="12" fill="#475569">L3-INNER • B1-06, B1-15</text><rect x="54" y="359" width="402" height="70" rx="10" fill="#e2ecf7" stroke="#8092a7"/><text x="68" y="384" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Внешний круг Верхнего уровня</text><text x="68" y="407" font-family="Arial,sans-serif" font-size="12" fill="#475569">L3-OUTER • B1-06</text><rect x="54" y="443" width="402" height="70" rx="10" fill="#e2ecf7" stroke="#8092a7"/><text x="68" y="468" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Трёхлучевая развилка у внешнего круга</text><text x="68" y="491" font-family="Arial,sans-serif" font-size="12" fill="#475569">L3-ISOLATION-TRIDENT • LR-B1-022</text><rect x="54" y="527" width="402" height="70" rx="10" fill="#e2ecf7" stroke="#8092a7"/><text x="68" y="552" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Широкий коридор главных лифтов Третьего</text><text x="68" y="575" font-family="Arial,sans-serif" font-size="12" fill="#475569">L3-MAIN-LIFTS-HALL • LR-B2-027</text><rect x="494" y="145" width="430" height="507" rx="14" fill="#fff" stroke="#94a3b8"/><text x="512" y="175" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#1e293b">Основные помещения</text><rect x="508" y="191" width="402" height="70" rx="10" fill="#e4f3e8" stroke="#8092a7"/><text x="522" y="216" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Капитанская рубка</text><text x="522" y="239" font-family="Arial,sans-serif" font-size="12" fill="#475569">L3-BRIDGE • B1-06</text><rect x="508" y="275" width="402" height="70" rx="10" fill="#e4f3e8" stroke="#8092a7"/><text x="522" y="300" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Каюты персонала</text><text x="522" y="323" font-family="Arial,sans-serif" font-size="12" fill="#475569">L3-CREW • B1-06, B1-15</text><rect x="508" y="359" width="402" height="70" rx="10" fill="#e4f3e8" stroke="#8092a7"/><text x="522" y="384" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Детский блок / кувезы</text><text x="522" y="407" font-family="Arial,sans-serif" font-size="12" fill="#475569">L3-CHILD-LAB • B1-15</text><rect x="508" y="443" width="402" height="70" rx="10" fill="#e4f3e8" stroke="#8092a7"/><text x="522" y="468" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Круглый зал отдыха</text><text x="522" y="491" font-family="Arial,sans-serif" font-size="12" fill="#475569">L3-REST • B1-15</text><rect x="508" y="527" width="402" height="70" rx="10" fill="#e4f3e8" stroke="#8092a7"/><text x="522" y="552" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Помещение изоляции перед освобождением детей</text><text x="522" y="575" font-family="Arial,sans-serif" font-size="12" fill="#475569">L3-ISOLATION-CELL • LR-B1-022</text><rect x="948" y="145" width="430" height="507" rx="14" fill="#fff" stroke="#94a3b8"/><text x="966" y="175" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#1e293b">Логистика / инженерия</text><rect x="962" y="191" width="402" height="70" rx="10" fill="#fef0dc" stroke="#8092a7"/><text x="976" y="216" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Склады, включая постельное бельё</text><text x="976" y="239" font-family="Arial,sans-serif" font-size="12" fill="#475569">L3-STORE • B1-14</text><rect x="962" y="275" width="402" height="70" rx="10" fill="#fef0dc" stroke="#8092a7"/><text x="976" y="300" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Просторный грузовой зал у производства</text><text x="976" y="323" font-family="Arial,sans-serif" font-size="12" fill="#475569">L3-CARGO-HALL • B2-13</text><rect x="962" y="359" width="402" height="70" rx="10" fill="#fef0dc" stroke="#8092a7"/><text x="976" y="384" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Грузовые лифты Третьего уровня</text><text x="976" y="407" font-family="Arial,sans-serif" font-size="12" fill="#475569">L3-FREIGHT-LIFTS • B2-13</text><rect x="962" y="443" width="402" height="70" rx="10" fill="#fef0dc" stroke="#8092a7"/><text x="976" y="468" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Шлюзы и ангары грузовых крейсеров</text><text x="976" y="491" font-family="Arial,sans-serif" font-size="12" fill="#475569">L3-DOCK • B1-14</text><rect x="962" y="527" width="402" height="70" rx="10" fill="#fef0dc" stroke="#8092a7"/><text x="976" y="552" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Производственные отсеки</text><text x="976" y="575" font-family="Arial,sans-serif" font-size="12" fill="#475569">L3-PRODUCTION • B1-06, B1-14</text><rect x="962" y="611" width="402" height="70" rx="10" fill="#fef0dc" stroke="#8092a7"/><text x="976" y="636" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Медицинский диагностический отсек Третьего уровня</text><text x="976" y="659" font-family="Arial,sans-serif" font-size="12" fill="#475569">L3-MEDICAL-ROOM • LR-B2-042</text><rect x="40" y="667" width="1320" height="471" rx="12" fill="#fff" stroke="#94a3b8"/><text x="58" y="694" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#1e293b">Явные отношения исходного графа</text><text x="60" y="721" font-family="Arial,sans-serif" font-size="13" fill="#334155">E34: L3 —[contains]→ L3-INNER • Внутренний круг</text><text x="60" y="747" font-family="Arial,sans-serif" font-size="13" fill="#334155">E35: L3 —[contains]→ L3-OUTER • Внешний круг</text><text x="60" y="773" font-family="Arial,sans-serif" font-size="13" fill="#334155">E36: L3-INNER —[contains]→ L3-BRIDGE • Рубка во внутреннем круге</text><text x="60" y="799" font-family="Arial,sans-serif" font-size="13" fill="#334155">E37: L3-INNER —[contains]→ L3-CREW • Каюты во внутреннем круге</text><text x="60" y="825" font-family="Arial,sans-serif" font-size="13" fill="#334155">E38: L3-INNER —[route_to]→ L3-CHILD-LAB • Путь по криволинейным коридорам</text><text x="60" y="851" font-family="Arial,sans-serif" font-size="13" fill="#334155">E41: L3-SERVICE —[access_to]→ L3-DOCK • Крейсерные ангары и шлюзы справа по маршруту</text><text x="60" y="877" font-family="Arial,sans-serif" font-size="13" fill="#334155">E42: L3-SERVICE —[route_to]→ L3-PRODUCTION • Производство дальше ангаров</text><text x="60" y="903" font-family="Arial,sans-serif" font-size="13" fill="#334155">E51: L3-FREIGHT-LIFTS —[corridor_near]→ L3-BRIDGE • От грузовых лифтов ход к коридору капитанской рубки</text><text x="60" y="929" font-family="Arial,sans-serif" font-size="13" fill="#334155">E52: L3-CARGO-HALL —[adjoins]→ L3-WORKSHOP-DOOR • Грузовой зал перед дверями производства</text><text x="60" y="955" font-family="Arial,sans-serif" font-size="13" fill="#334155">E53: L3-WORKSHOP-DOOR —[access_to]→ L3-PRODUCTION • Двери цеха связаны с производственными отсеками</text><text x="60" y="981" font-family="Arial,sans-serif" font-size="13" fill="#334155">E74: L3-OUTER —[route_to]→ L3-ISOLATION-TRIDENT • Трёхлучевая развилка расположена около внешнего круга Третьего.</text><text x="60" y="1007" font-family="Arial,sans-serif" font-size="13" fill="#334155">E76: L3-ISOLATION-TRIDENT —[route_to]→ L3-ISOLATION-CELL • Через поворот и центральный коридор герои достигают запертой камеры изоляции.</text><text x="60" y="1033" font-family="Arial,sans-serif" font-size="13" fill="#334155">E77: L3-ISOLATION-CELL —[escape_route_to]→ L3-LIFT-PLATFORM • После освобождения путь ведёт запасным коридором на круглую контейнерную площадку у лифта.</text><text x="60" y="1059" font-family="Arial,sans-serif" font-size="13" fill="#334155">E141: L3-BRIDGE —[route_via_two_turns]→ L3-MAIN-LIFTS-HALL • Эмма после двух поворотов от командной рубки достигает широкого коридора к главным лифтам; это маршрут, не непосредственная смежная дверь.</text><text x="60" y="1085" font-family="Arial,sans-serif" font-size="13" fill="#334155">E142: L3-MAIN-LIFTS-HALL —[route_to_production_gate]→ L3-WORKSHOP-DOOR • Широкий коридор Третьего доводит к закрытым дверям производственного цеха.</text><text x="60" y="1111" font-family="Arial,sans-serif" font-size="13" fill="#334155">E143: L3-CREW —[near_not_direct_door]→ L3-CHILD-LAB • Детский блок с кувезами расположен рядом с жилыми каютами взрослого сектора, общая дверь не доказана.</text><text x="42" y="1208" font-family="Arial,sans-serif" font-size="13" fill="#475569">Полный периметр стен, размеры, XY, азимуты и высоты палуб: неизвестны • MOAG / SHIP-MLP-MOAG-001</text></svg>