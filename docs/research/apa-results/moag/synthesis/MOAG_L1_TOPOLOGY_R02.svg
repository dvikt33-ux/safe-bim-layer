<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1213" viewBox="0 0 1400 1213"><rect width="1400" height="1213" fill="#f6f7f9"/><text x="42" y="48" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#16202a">МОАГ — Первый / Нижний уровень</text><text x="42" y="83" font-family="Arial,sans-serif" font-size="17" fill="#334155">Функциональные группы и подтверждённые локальные связи.</text><rect x="40" y="100" width="1320" height="40" rx="8" fill="#fff4d6" stroke="#d29b26"/><text x="56" y="126" font-family="Arial,sans-serif" font-size="15" fill="#684b00">Схема отношений; не план в масштабе. Позиции карточек не задают координаты, расстояния или ориентацию.</text><rect x="40" y="145" width="430" height="591" rx="14" fill="#fff" stroke="#94a3b8"/><text x="58" y="175" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#1e293b">Уровень и циркуляция</text><rect x="54" y="191" width="402" height="70" rx="10" fill="#e2ecf7" stroke="#8092a7"/><text x="68" y="216" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Первый / Нижний уровень</text><text x="68" y="239" font-family="Arial,sans-serif" font-size="12" fill="#475569">L1 • B1-06, B2-01</text><rect x="54" y="275" width="402" height="70" rx="10" fill="#e2ecf7" stroke="#8092a7"/><text x="68" y="300" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Внутренний малый круг</text><text x="68" y="323" font-family="Arial,sans-serif" font-size="12" fill="#475569">L1-INNER • B1-06</text><rect x="54" y="359" width="402" height="70" rx="10" fill="#e2ecf7" stroke="#8092a7"/><text x="68" y="384" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Внешний круг</text><text x="68" y="407" font-family="Arial,sans-serif" font-size="12" fill="#475569">L1-OUTER • B1-06</text><rect x="54" y="443" width="402" height="70" rx="10" fill="#e2ecf7" stroke="#8092a7"/><text x="68" y="468" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Магистральный коридор ангаров</text><text x="68" y="491" font-family="Arial,sans-serif" font-size="12" fill="#475569">L1-ANGAR-HALL • B2-14</text><rect x="54" y="527" width="402" height="70" rx="10" fill="#e2ecf7" stroke="#8092a7"/><text x="68" y="552" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Отдельный широкий ПРЯМОЙ грузовой коридор</text><text x="68" y="575" font-family="Arial,sans-serif" font-size="12" fill="#475569">L1-STRAIGHT-FREIGHT • LR-B1-044</text><rect x="494" y="145" width="430" height="591" rx="14" fill="#fff" stroke="#94a3b8"/><text x="512" y="175" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#1e293b">Жилые и закрытые зоны</text><rect x="508" y="191" width="402" height="70" rx="10" fill="#e4f3e8" stroke="#8092a7"/><text x="522" y="216" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Район бывших баз спецподразделения</text><text x="522" y="239" font-family="Arial,sans-serif" font-size="12" fill="#475569">L1-BASES • B1-06, B2-01</text><rect x="508" y="275" width="402" height="70" rx="10" fill="#e4f3e8" stroke="#8092a7"/><text x="522" y="300" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Темная база</text><text x="522" y="323" font-family="Arial,sans-serif" font-size="12" fill="#475569">L1-TEMNAYA • B1-10, B1-13</text><rect x="508" y="359" width="402" height="70" rx="10" fill="#e4f3e8" stroke="#8092a7"/><text x="522" y="384" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Общее помещение Темной базы</text><text x="522" y="407" font-family="Arial,sans-serif" font-size="12" fill="#475569">L1-BASE-COMMON • B1-13</text><rect x="508" y="443" width="402" height="70" rx="10" fill="#e4f3e8" stroke="#8092a7"/><text x="522" y="468" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Спальные комнаты Темной базы</text><text x="522" y="491" font-family="Arial,sans-serif" font-size="12" fill="#475569">L1-BASE-SLEEP • B1-10, B1-13</text><rect x="508" y="527" width="402" height="70" rx="10" fill="#e4f3e8" stroke="#8092a7"/><text x="522" y="552" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Запечатанная/неисследованная часть</text><text x="522" y="575" font-family="Arial,sans-serif" font-size="12" fill="#475569">L1-SEALED • B1-06, B2-01</text><rect x="948" y="145" width="430" height="591" rx="14" fill="#fff" stroke="#94a3b8"/><text x="966" y="175" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#1e293b">Технические объёмы / высота</text><rect x="962" y="191" width="402" height="70" rx="10" fill="#fef0dc" stroke="#8092a7"/><text x="976" y="216" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Цех сортировки/переработки отходов</text><text x="976" y="239" font-family="Arial,sans-serif" font-size="12" fill="#475569">L1-RECYCLING • B1-06, B1-14</text><rect x="962" y="275" width="402" height="70" rx="10" fill="#fef0dc" stroke="#8092a7"/><text x="976" y="300" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Ангар с двумя одноместными катерами</text><text x="976" y="323" font-family="Arial,sans-serif" font-size="12" fill="#475569">L1-ANGAR • B2-14</text><rect x="962" y="359" width="402" height="70" rx="10" fill="#fef0dc" stroke="#8092a7"/><text x="976" y="384" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Операторские кабины ангара</text><text x="976" y="407" font-family="Arial,sans-serif" font-size="12" fill="#475569">L1-OPERATORS • B2-14</text><rect x="962" y="443" width="402" height="70" rx="10" fill="#fef0dc" stroke="#8092a7"/><text x="976" y="468" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Шлюз катеров Нижнего уровня</text><text x="976" y="491" font-family="Arial,sans-serif" font-size="12" fill="#475569">L1-BOAT-LOCK • B2-14</text><rect x="962" y="527" width="402" height="70" rx="10" fill="#fef0dc" stroke="#8092a7"/><text x="976" y="552" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Неизвестное помещение ниже обитаемой части Нижнего уровня</text><text x="976" y="575" font-family="Arial,sans-serif" font-size="12" fill="#475569">SUB-LOWER-WELL • B1-04</text><rect x="962" y="611" width="402" height="70" rx="10" fill="#fef0dc" stroke="#8092a7"/><text x="976" y="636" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Высокий круглый зал в закрытом секторе</text><text x="976" y="659" font-family="Arial,sans-serif" font-size="12" fill="#475569">L1-CIRCULAR-HALL • B1-17</text><rect x="962" y="695" width="402" height="70" rx="10" fill="#fef0dc" stroke="#8092a7"/><text x="976" y="720" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Верхний металлический мостик круглого зала</text><text x="976" y="743" font-family="Arial,sans-serif" font-size="12" fill="#475569">L1-CIRCULAR-UPPER-WALK • B1-17</text><rect x="40" y="751" width="1320" height="367" rx="12" fill="#fff" stroke="#94a3b8"/><text x="58" y="778" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#1e293b">Явные отношения исходного графа</text><text x="60" y="805" font-family="Arial,sans-serif" font-size="13" fill="#334155">E03: L1 —[contains]→ L1-BASES • Район баз</text><text x="60" y="831" font-family="Arial,sans-serif" font-size="13" fill="#334155">E07: L1-BASES —[includes]→ L1-TEMNAYA • Темная база среди старых баз</text><text x="60" y="857" font-family="Arial,sans-serif" font-size="13" fill="#334155">E11: L1-TEMNAYA —[contains]→ L1-BASE-COMMON • Общая комната</text><text x="60" y="883" font-family="Arial,sans-serif" font-size="13" fill="#334155">E14: L1-BASE-COMMON —[stairs_to]→ L1-BASE-SLEEP • Лестница к части спален</text><text x="60" y="909" font-family="Arial,sans-serif" font-size="13" fill="#334155">E20: L1-ANGAR-HALL —[access_to]→ L1-ANGAR • Двери из прохода в ангар</text><text x="60" y="935" font-family="Arial,sans-serif" font-size="13" fill="#334155">E66: L1-CIRCULAR-HALL —[contains]→ L1-CIRCULAR-UPPER-WALK • Мостик расположен в верхней части круглого зала, идет полукругом по половине периметра.</text><text x="60" y="961" font-family="Arial,sans-serif" font-size="13" fill="#334155">E69: L1-CIRCULAR-UPPER-WALK —[door_to]→ L1-CIRCULAR-CONTROL • На верхнем мостике дверь ведёт в помещение с пультами управления шлюзами.</text><text x="60" y="987" font-family="Arial,sans-serif" font-size="13" fill="#334155">E70: L1-CIRCULAR-CONTROL —[door_to]→ L1-CIRCULAR-QUARTERS • За операторской после следующей закрытой двери находится жилое помещение.</text><text x="60" y="1013" font-family="Arial,sans-serif" font-size="13" fill="#334155">E79: LINK-LIFT-SHAFT —[emergency_vertical_exit]→ L1-LIFT-SHAFT-EXIT • Через потолочный люк кабины, крышу, веревочную лестницу и боковой проём в стене шахты.</text><text x="60" y="1039" font-family="Arial,sans-serif" font-size="13" fill="#334155">E80: L1-LIFT-SHAFT-EXIT —[near_route_to]→ L1-RECYCLING • На Нижнем слышен шум мусорки и чувствуется запах; не установлен контакт проёма непосредственно с цехом.</text><text x="60" y="1065" font-family="Arial,sans-serif" font-size="13" fill="#334155">E94: L1-ENG-CABLE-NICHES —[route_to]→ L1-STRAIGHT-FREIGHT • Из узких инженерных ниш выход в прямой широкий грузовой проход.</text><text x="60" y="1091" font-family="Arial,sans-serif" font-size="13" fill="#334155">E139: L1-ANGAR —[pressure_sealed_access_to]→ L1-BOAT-LOCK • При выходе катера из ангара в шлюз со стороны ангара герметично закрывается дверь и откачивается воздух. Ангар и шлюз — разные объёмы.</text><text x="42" y="1188" font-family="Arial,sans-serif" font-size="13" fill="#475569">Полный периметр стен, размеры, XY, азимуты и высоты палуб: неизвестны • MOAG / SHIP-MLP-MOAG-001</text></svg>