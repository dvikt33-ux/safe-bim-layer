<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="935" viewBox="0 0 1400 935"><rect width="1400" height="935" fill="#f6f7f9"/><text x="42" y="48" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#16202a">МОАГ — принципиальный вертикальный разрез</text><text x="42" y="83" font-family="Arial,sans-serif" font-size="17" fill="#334155">Глобальные уровни и локальные отношения выше/ниже.</text><rect x="40" y="100" width="1320" height="40" rx="8" fill="#fff4d6" stroke="#d29b26"/><text x="56" y="126" font-family="Arial,sans-serif" font-size="15" fill="#684b00">Z01–Z06 задают только относительные условия. Позиция карточек не является высотой в масштабе.</text><rect x="40" y="145" width="430" height="339" rx="14" fill="#fff" stroke="#94a3b8"/><text x="58" y="175" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#1e293b">Глобальная система</text><rect x="54" y="191" width="402" height="70" rx="10" fill="#e2ecf7" stroke="#8092a7"/><text x="68" y="216" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Третий / верхний уровень</text><text x="68" y="239" font-family="Arial,sans-serif" font-size="12" fill="#475569">L3 • B1-06, B1-15</text><rect x="54" y="275" width="402" height="70" rx="10" fill="#e2ecf7" stroke="#8092a7"/><text x="68" y="300" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Второй / детский уровень</text><text x="68" y="323" font-family="Arial,sans-serif" font-size="12" fill="#475569">L2 • B1-03, B1-04</text><rect x="54" y="359" width="402" height="70" rx="10" fill="#e2ecf7" stroke="#8092a7"/><text x="68" y="384" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Первый / Нижний уровень</text><text x="68" y="407" font-family="Arial,sans-serif" font-size="12" fill="#475569">L1 • B1-06, B2-01</text><rect x="494" y="145" width="430" height="339" rx="14" fill="#fff" stroke="#94a3b8"/><text x="512" y="175" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#1e293b">Частичные ярусы</text><rect x="508" y="191" width="402" height="70" rx="10" fill="#e4f3e8" stroke="#8092a7"/><text x="522" y="216" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Высокий круглый зал в закрытом секторе</text><text x="522" y="239" font-family="Arial,sans-serif" font-size="12" fill="#475569">L1-CIRCULAR-HALL • B1-17</text><rect x="508" y="275" width="402" height="70" rx="10" fill="#fef0dc" stroke="#8092a7"/><text x="522" y="300" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Верхний металлический мостик круглого зала</text><text x="522" y="323" font-family="Arial,sans-serif" font-size="12" fill="#475569">L1-CIRCULAR-UPPER-WALK • B1-17</text><rect x="508" y="359" width="402" height="70" rx="10" fill="#fef0dc" stroke="#8092a7"/><text x="522" y="384" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Операторские кабины ангара</text><text x="522" y="407" font-family="Arial,sans-serif" font-size="12" fill="#475569">L1-OPERATORS • B2-14</text><rect x="508" y="443" width="402" height="70" rx="10" fill="#fef0dc" stroke="#8092a7"/><text x="522" y="468" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Периметральная верхняя галерея круглого зала отдыха</text><text x="522" y="491" font-family="Arial,sans-serif" font-size="12" fill="#475569">L3-REST-UPPER-GALLERY • LR-B1-61</text><rect x="948" y="145" width="430" height="339" rx="14" fill="#fff" stroke="#94a3b8"/><text x="966" y="175" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#1e293b">Ниже / сквозной объём</text><rect x="962" y="191" width="402" height="70" rx="10" fill="#fde2e2" stroke="#8092a7"/><text x="976" y="216" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Неизвестное помещение ниже обитаемой части Нижнего уровня</text><text x="976" y="239" font-family="Arial,sans-serif" font-size="12" fill="#475569">SUB-LOWER-WELL • B1-04</text><rect x="962" y="275" width="402" height="70" rx="10" fill="#e7e3fa" stroke="#8092a7"/><text x="976" y="300" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Круглый центральный инженерный объем трёх уровней</text><text x="976" y="323" font-family="Arial,sans-serif" font-size="12" fill="#475569">CORE-ENERGY-SHAFT • LR-B2-034</text><rect x="962" y="359" width="402" height="70" rx="10" fill="#e4f3e8" stroke="#8092a7"/><text x="976" y="384" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Кольцевой двухэтажный жилой блок Второго</text><text x="976" y="407" font-family="Arial,sans-serif" font-size="12" fill="#475569">L2-RESIDENTIAL-RING • LR-B1-056</text><rect x="40" y="499" width="1320" height="341" rx="12" fill="#fff" stroke="#94a3b8"/><text x="58" y="526" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#1e293b">Явные отношения исходного графа</text><text x="60" y="553" font-family="Arial,sans-serif" font-size="13" fill="#334155">E57: SUB-LOWER-WELL —[below]→ L1 • Помещения ниже известного Нижнего уровня; не автоматически уровень L0.</text><text x="60" y="579" font-family="Arial,sans-serif" font-size="13" fill="#334155">E66: L1-CIRCULAR-HALL —[contains]→ L1-CIRCULAR-UPPER-WALK • Мостик расположен в верхней части круглого зала, идет полукругом по половине периметра.</text><text x="60" y="605" font-family="Arial,sans-serif" font-size="13" fill="#334155">E71: L1-CIRCULAR-UPPER-WALK —[above]→ L1-CIRCULAR-HALL • Мостик расположен почти под потолком выше пола зала.</text><text x="60" y="631" font-family="Arial,sans-serif" font-size="13" fill="#334155">E73: L1-LOWER-BLOCK-STRATA —[includes]→ L1-OPERATORS • Подпотолочные операторские кабины ангаров — другой локальный верхний ярус.</text><text x="60" y="657" font-family="Arial,sans-serif" font-size="13" fill="#334155">E93: L1-DARK-UPPER-PERIMETER —[above_floor]→ L1-BASE-COMMON • Под галереей сидят дети; значит она расположена выше основной отметки общего пола.</text><text x="60" y="683" font-family="Arial,sans-serif" font-size="13" fill="#334155">E103: L2-RESIDENTIAL-UPPER —[above]→ L2-RESIDENTIAL-LOWER • Второй этаж кают расположен выше первого этажа общественных помещений.</text><text x="60" y="709" font-family="Arial,sans-serif" font-size="13" fill="#334155">E119: L3-REST —[contains]→ L3-REST-UPPER-GALLERY • Верхняя галерея огибает круглый зал по периметру.</text><text x="60" y="735" font-family="Arial,sans-serif" font-size="13" fill="#334155">E123: L3-REST-UPPER-GALLERY —[above_floor]→ L3-REST • Галерея расположена над залом, из неё видно расположенные внизу диваны и столы.</text><text x="60" y="761" font-family="Arial,sans-serif" font-size="13" fill="#334155">E159: CORE-ENERGY-SHAFT —[vertical_extent_in_level_no_access_proven]→ L1 • Центральный объём охватывает Нижний уровень; прямая дверь на этот уровень из центральной шахты пока не доказана.</text><text x="60" y="787" font-family="Arial,sans-serif" font-size="13" fill="#334155">E160: CORE-ENERGY-SHAFT —[vertical_extent_in_level_no_access_proven]→ L2 • Центральный объём охватывает Второй уровень; наличие доступного выхода из шахты на Второй не доказано.</text><text x="60" y="813" font-family="Arial,sans-serif" font-size="13" fill="#334155">E161: CORE-ENERGY-SHAFT —[vertical_extent_in_level_no_access_proven]→ L3 • Центральный объём выходит на Третий уровень; подтверждена галерея с отдельным запираемым входом.</text><text x="42" y="910" font-family="Arial,sans-serif" font-size="13" fill="#475569">Полный периметр стен, размеры, XY, азимуты и высоты палуб: неизвестны • MOAG / SHIP-MLP-MOAG-001</text></svg>