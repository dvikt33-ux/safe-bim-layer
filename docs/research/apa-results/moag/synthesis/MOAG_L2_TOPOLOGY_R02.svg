<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1265" viewBox="0 0 1400 1265"><rect width="1400" height="1265" fill="#f6f7f9"/><text x="42" y="48" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#16202a">МОАГ — Второй / Детский уровень</text><text x="42" y="83" font-family="Arial,sans-serif" font-size="17" fill="#334155">Магистрали, жилая зона, детские учреждения и туннельные маршруты.</text><rect x="40" y="100" width="1320" height="40" rx="8" fill="#fff4d6" stroke="#d29b26"/><text x="56" y="126" font-family="Arial,sans-serif" font-size="15" fill="#684b00">Схема отношений; не план в масштабе. Позиции карточек не задают координаты, расстояния или ориентацию.</text><rect x="40" y="145" width="430" height="591" rx="14" fill="#fff" stroke="#94a3b8"/><text x="58" y="175" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#1e293b">Магистрали / центр</text><rect x="54" y="191" width="402" height="70" rx="10" fill="#e2ecf7" stroke="#8092a7"/><text x="68" y="216" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Второй / детский уровень</text><text x="68" y="239" font-family="Arial,sans-serif" font-size="12" fill="#475569">L2 • B1-03, B1-04</text><rect x="54" y="275" width="402" height="70" rx="10" fill="#e2ecf7" stroke="#8092a7"/><text x="68" y="300" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Внутренняя Зелёная магистраль</text><text x="68" y="323" font-family="Arial,sans-serif" font-size="12" fill="#475569">L2-GREEN • B1-04</text><rect x="54" y="359" width="402" height="70" rx="10" fill="#e2ecf7" stroke="#8092a7"/><text x="68" y="384" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Оранжевая магистраль</text><text x="68" y="407" font-family="Arial,sans-serif" font-size="12" fill="#475569">L2-ORANGE • B1-04</text><rect x="54" y="443" width="402" height="70" rx="10" fill="#e2ecf7" stroke="#8092a7"/><text x="68" y="468" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Главная площадь</text><text x="68" y="491" font-family="Arial,sans-serif" font-size="12" fill="#475569">L2-PLAZA • B1-03, B1-04</text><rect x="54" y="527" width="402" height="70" rx="10" fill="#e2ecf7" stroke="#8092a7"/><text x="68" y="552" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Жилая галерея над Главной площадью</text><text x="68" y="575" font-family="Arial,sans-serif" font-size="12" fill="#475569">L2-GALLERY • B1-03</text><rect x="494" y="145" width="430" height="591" rx="14" fill="#fff" stroke="#94a3b8"/><text x="512" y="175" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#1e293b">Жилые зоны</text><rect x="508" y="191" width="402" height="70" rx="10" fill="#e4f3e8" stroke="#8092a7"/><text x="522" y="216" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Кольцевой двухэтажный жилой блок Второго</text><text x="522" y="239" font-family="Arial,sans-serif" font-size="12" fill="#475569">L2-RESIDENTIAL-RING • LR-B1-056</text><rect x="508" y="275" width="402" height="70" rx="10" fill="#e4f3e8" stroke="#8092a7"/><text x="522" y="300" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Верхний этаж кают внутри жилого кольца</text><text x="522" y="323" font-family="Arial,sans-serif" font-size="12" fill="#475569">L2-RESIDENTIAL-UPPER • LR-B1-056</text><rect x="508" y="359" width="402" height="70" rx="10" fill="#e4f3e8" stroke="#8092a7"/><text x="522" y="384" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Нижний торгово-игровой этаж жилого кольца</text><text x="522" y="407" font-family="Arial,sans-serif" font-size="12" fill="#475569">L2-RESIDENTIAL-LOWER • LR-B1-056</text><rect x="508" y="443" width="402" height="70" rx="10" fill="#e4f3e8" stroke="#8092a7"/><text x="522" y="468" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Детские каюты</text><text x="522" y="491" font-family="Arial,sans-serif" font-size="12" fill="#475569">L2-CABINS • B1-03</text><rect x="508" y="527" width="402" height="70" rx="10" fill="#e4f3e8" stroke="#8092a7"/><text x="522" y="552" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Кафе и магазины</text><text x="522" y="575" font-family="Arial,sans-serif" font-size="12" fill="#475569">L2-CAFE • B1-04</text><rect x="948" y="145" width="430" height="591" rx="14" fill="#fff" stroke="#94a3b8"/><text x="966" y="175" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#1e293b">Детские / учебные / проходы</text><rect x="962" y="191" width="402" height="70" rx="10" fill="#fef0dc" stroke="#8092a7"/><text x="976" y="216" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Детский сад Второго уровня</text><text x="976" y="239" font-family="Arial,sans-serif" font-size="12" fill="#475569">L2-NURSERY • LR-B1-025</text><rect x="962" y="275" width="402" height="70" rx="10" fill="#fef0dc" stroke="#8092a7"/><text x="976" y="300" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Игровая младшего отделения</text><text x="976" y="323" font-family="Arial,sans-serif" font-size="12" fill="#475569">L2-INFANT-PLAY • LR-B1-025</text><rect x="962" y="359" width="402" height="70" rx="10" fill="#fef0dc" stroke="#8092a7"/><text x="976" y="384" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Прогулочная площадка младшего отделения</text><text x="976" y="407" font-family="Arial,sans-serif" font-size="12" fill="#475569">L2-INFANT-YARD • LR-B1-026</text><rect x="962" y="443" width="402" height="70" rx="10" fill="#fef0dc" stroke="#8092a7"/><text x="976" y="468" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Школа / экзаменационный блок</text><text x="976" y="491" font-family="Arial,sans-serif" font-size="12" fill="#475569">L2-SCHOOL • B1-03</text><rect x="962" y="527" width="402" height="70" rx="10" fill="#fef0dc" stroke="#8092a7"/><text x="976" y="552" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Шестые туннели</text><text x="976" y="575" font-family="Arial,sans-serif" font-size="12" fill="#475569">L2-T06 • B1-04</text><rect x="962" y="611" width="402" height="70" rx="10" fill="#fef0dc" stroke="#8092a7"/><text x="976" y="636" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Семнадцатые туннели</text><text x="976" y="659" font-family="Arial,sans-serif" font-size="12" fill="#475569">L2-T17 • B1-04</text><rect x="962" y="695" width="402" height="70" rx="10" fill="#fef0dc" stroke="#8092a7"/><text x="976" y="720" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Вентиляционная решётка Второго около пола</text><text x="976" y="743" font-family="Arial,sans-serif" font-size="12" fill="#475569">L2-VENT-LOW-GRILLE • LR-B1-64</text><rect x="40" y="751" width="1320" height="419" rx="12" fill="#fff" stroke="#94a3b8"/><text x="58" y="778" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#1e293b">Явные отношения исходного графа</text><text x="60" y="805" font-family="Arial,sans-serif" font-size="13" fill="#334155">E24: L2 —[contains]→ L2-GREEN • Внутренняя магистраль</text><text x="60" y="831" font-family="Arial,sans-serif" font-size="13" fill="#334155">E25: L2 —[contains]→ L2-ORANGE • Внешняя магистраль</text><text x="60" y="857" font-family="Arial,sans-serif" font-size="13" fill="#334155">E27: L2-ORANGE —[tunnel_to]→ L2-GREEN • Переход по туннелю через магистрали</text><text x="60" y="883" font-family="Arial,sans-serif" font-size="13" fill="#334155">E28: L2-GREEN —[adjoins]→ L2-PLAZA • Зелёная окружает площадь</text><text x="60" y="909" font-family="Arial,sans-serif" font-size="13" fill="#334155">E29: L2-GALLERY —[overlooks]→ L2-PLAZA • Галерея над Главной площадью</text><text x="60" y="935" font-family="Arial,sans-serif" font-size="13" fill="#334155">E30: L2-GALLERY —[access_to]→ L2-CABINS • Каюты выходят на галерею</text><text x="60" y="961" font-family="Arial,sans-serif" font-size="13" fill="#334155">E82: L2 —[contains]→ L2-NURSERY • Детский сад с отделениями на Втором уровне.</text><text x="60" y="987" font-family="Arial,sans-serif" font-size="13" fill="#334155">E83: L2-NURSERY —[includes]→ L2-INFANT-PLAY • Игровая младшего отделения.</text><text x="60" y="1013" font-family="Arial,sans-serif" font-size="13" fill="#334155">E84: L2-INFANT-PLAY —[door_to]→ L2-INFANT-YARD • Прогулочная площадка находится сразу за дверью младшего отделения.</text><text x="60" y="1039" font-family="Arial,sans-serif" font-size="13" fill="#334155">E100: L2 —[contains]→ L2-RESIDENTIAL-RING • Двухэтажный жилой блок находится внутри глобального Второго.</text><text x="60" y="1065" font-family="Arial,sans-serif" font-size="13" fill="#334155">E101: L2-RESIDENTIAL-RING —[contains]→ L2-RESIDENTIAL-UPPER • Каюты на верхней отметке жилого кольца.</text><text x="60" y="1091" font-family="Arial,sans-serif" font-size="13" fill="#334155">E102: L2-RESIDENTIAL-RING —[contains]→ L2-RESIDENTIAL-LOWER • Магазины, игры и туннели на нижней отметке жилого кольца.</text><text x="60" y="1117" font-family="Arial,sans-serif" font-size="13" fill="#334155">E103: L2-RESIDENTIAL-UPPER —[above]→ L2-RESIDENTIAL-LOWER • Второй этаж кают расположен выше первого этажа общественных помещений.</text><text x="60" y="1143" font-family="Arial,sans-serif" font-size="13" fill="#334155">E106: L2-RESIDENTIAL-LOWER —[tunnels_to]→ L2-ORANGE • Из нижних магазинов и игровых через многочисленные туннели на Оранжевую.</text><text x="42" y="1240" font-family="Arial,sans-serif" font-size="13" fill="#475569">Полный периметр стен, размеры, XY, азимуты и высоты палуб: неизвестны • MOAG / SHIP-MLP-MOAG-001</text></svg>