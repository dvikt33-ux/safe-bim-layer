<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="961" viewBox="0 0 1400 961"><rect width="1400" height="961" fill="#f6f7f9"/><text x="42" y="48" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#16202a">МОАГ — центральное энергетическое ядро</text><text x="42" y="83" font-family="Arial,sans-serif" font-size="17" fill="#334155">Путь доступа на Третьем и доказанный вертикальный охват.</text><rect x="40" y="100" width="1320" height="40" rx="8" fill="#fff4d6" stroke="#d29b26"/><text x="56" y="126" font-family="Arial,sans-serif" font-size="15" fill="#684b00">Только доступ с L3 подтверждён; прямой доступ из L1/L2 не доказан. Карточки не задают план или высоты.</text><rect x="40" y="145" width="430" height="339" rx="14" fill="#fff" stroke="#94a3b8"/><text x="58" y="175" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#1e293b">Подход с L3</text><rect x="54" y="191" width="402" height="70" rx="10" fill="#e7effa" stroke="#8092a7"/><text x="68" y="216" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Детский блок / кувезы</text><text x="68" y="239" font-family="Arial,sans-serif" font-size="12" fill="#475569">L3-CHILD-LAB • B1-15</text><rect x="54" y="275" width="402" height="70" rx="10" fill="#e7effa" stroke="#8092a7"/><text x="68" y="300" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Узкий проход к энергомодулю за Детским блоком</text><text x="68" y="323" font-family="Arial,sans-serif" font-size="12" fill="#475569">L3-ENERGY-APPROACH • LR-B2-034</text><rect x="54" y="359" width="402" height="70" rx="10" fill="#e7effa" stroke="#8092a7"/><text x="68" y="384" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Защищенная сдвижная дверь энергокамеры</text><text x="68" y="407" font-family="Arial,sans-serif" font-size="12" fill="#475569">L3-ENERGY-GATE • LR-B2-034</text><rect x="494" y="145" width="430" height="339" rx="14" fill="#fff" stroke="#94a3b8"/><text x="512" y="175" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#1e293b">Галерея / обзор</text><rect x="508" y="191" width="402" height="70" rx="10" fill="#e7effa" stroke="#8092a7"/><text x="522" y="216" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Кольцевая огражденная галерея центрального энергомодуля</text><text x="522" y="239" font-family="Arial,sans-serif" font-size="12" fill="#475569">CORE-ENERGY-GALLERY • LR-B2-034</text><rect x="508" y="275" width="402" height="70" rx="10" fill="#e7effa" stroke="#8092a7"/><text x="522" y="300" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Центральный энергомодуль</text><text x="522" y="323" font-family="Arial,sans-serif" font-size="12" fill="#475569">CORE-ENERGY • B2-01, LR-B2-034</text><rect x="508" y="359" width="402" height="70" rx="10" fill="#e7effa" stroke="#8092a7"/><text x="522" y="384" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Логический маршрут допуска к энергокамере (не дополнительный коридор)</text><text x="522" y="407" font-family="Arial,sans-serif" font-size="12" fill="#475569">CORE-ENERGY-ACCESS • LR-B2-034</text><rect x="948" y="145" width="430" height="339" rx="14" fill="#fff" stroke="#94a3b8"/><text x="966" y="175" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#1e293b">Вертикальный объём</text><rect x="962" y="191" width="402" height="70" rx="10" fill="#e7effa" stroke="#8092a7"/><text x="976" y="216" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Круглый центральный инженерный объем трёх уровней</text><text x="976" y="239" font-family="Arial,sans-serif" font-size="12" fill="#475569">CORE-ENERGY-SHAFT • LR-B2-034</text><rect x="962" y="275" width="402" height="70" rx="10" fill="#e7effa" stroke="#8092a7"/><text x="976" y="300" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Первый / Нижний уровень</text><text x="976" y="323" font-family="Arial,sans-serif" font-size="12" fill="#475569">L1 • B1-06, B2-01</text><rect x="962" y="359" width="402" height="70" rx="10" fill="#e7effa" stroke="#8092a7"/><text x="976" y="384" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Второй / детский уровень</text><text x="976" y="407" font-family="Arial,sans-serif" font-size="12" fill="#475569">L2 • B1-03, B1-04</text><rect x="962" y="443" width="402" height="70" rx="10" fill="#e7effa" stroke="#8092a7"/><text x="976" y="468" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Третий / верхний уровень</text><text x="976" y="491" font-family="Arial,sans-serif" font-size="12" fill="#475569">L3 • B1-06, B1-15</text><rect x="40" y="499" width="1320" height="367" rx="12" fill="#fff" stroke="#94a3b8"/><text x="58" y="526" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#1e293b">Явные отношения исходного графа</text><text x="60" y="553" font-family="Arial,sans-serif" font-size="13" fill="#334155">E146: L3-CHILD-LAB —[behind_not_proven_direct_door]→ L3-ENERGY-APPROACH • Подход расположен за Детским блоком, прямая внутренняя дверь между комнатами не доказана.</text><text x="60" y="579" font-family="Arial,sans-serif" font-size="13" fill="#334155">E147: L3-ENERGY-APPROACH —[ends_at_door]→ L3-ENERGY-GATE • В узком коридоре единственная защищенная дверь.</text><text x="60" y="605" font-family="Arial,sans-serif" font-size="13" fill="#334155">E148: L3-ENERGY-GATE —[opens_to]→ CORE-ENERGY-GALLERY • После открытия двери можно попасть на круглую металлическую галерею.</text><text x="60" y="631" font-family="Arial,sans-serif" font-size="13" fill="#334155">E149: CORE-ENERGY-SHAFT —[contains]→ CORE-ENERGY-GALLERY • В высоком круглом помещении имеется галерея.</text><text x="60" y="657" font-family="Arial,sans-serif" font-size="13" fill="#334155">E150: CORE-ENERGY-SHAFT —[contains]→ CORE-ENERGY • Внутри центрального круглого объема размещена колба энергоустановки.</text><text x="60" y="683" font-family="Arial,sans-serif" font-size="13" fill="#334155">E154: CORE-ENERGY-GALLERY —[circumferential_overlook]→ CORE-ENERGY • Галерея окружает центральную колбу.</text><text x="60" y="709" font-family="Arial,sans-serif" font-size="13" fill="#334155">E155: L3-CHILD-LAB —[behind_child_block_not_door]→ CORE-ENERGY-ACCESS • Внутри Третьего проход к энергомодулю располагается непосредственно за Детским блоком, доступ по отдельному коридору.</text><text x="60" y="735" font-family="Arial,sans-serif" font-size="13" fill="#334155">E156: CORE-ENERGY-ACCESS —[single_locked_door_to]→ CORE-ENERGY-GALLERY • Из узкого полутёмного коридора через одну запираемую дверь герои входят в круглое помещение энергомодуля на кольцевую галерею.</text><text x="60" y="761" font-family="Arial,sans-serif" font-size="13" fill="#334155">E159: CORE-ENERGY-SHAFT —[vertical_extent_in_level_no_access_proven]→ L1 • Центральный объём охватывает Нижний уровень; прямая дверь на этот уровень из центральной шахты пока не доказана.</text><text x="60" y="787" font-family="Arial,sans-serif" font-size="13" fill="#334155">E160: CORE-ENERGY-SHAFT —[vertical_extent_in_level_no_access_proven]→ L2 • Центральный объём охватывает Второй уровень; наличие доступного выхода из шахты на Второй не доказано.</text><text x="60" y="813" font-family="Arial,sans-serif" font-size="13" fill="#334155">E161: CORE-ENERGY-SHAFT —[vertical_extent_in_level_no_access_proven]→ L3 • Центральный объём выходит на Третий уровень; подтверждена галерея с отдельным запираемым входом.</text><text x="60" y="839" font-family="Arial,sans-serif" font-size="13" fill="#334155">E162: CORE-ENERGY-GALLERY —[overlooks_transparent_energy_column]→ CORE-ENERGY • Из галереи персонажи наблюдают прозрачную вертикальную колбу энергомодуля, но её высота и диаметр неизвестны.</text><text x="42" y="936" font-family="Arial,sans-serif" font-size="13" fill="#475569">Полный периметр стен, размеры, XY, азимуты и высоты палуб: неизвестны • MOAG / SHIP-MLP-MOAG-001</text></svg>