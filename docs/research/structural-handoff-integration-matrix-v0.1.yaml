  - engineer_owns_final_structural_calculation
  - H0_must_not_claim_H1
  - H1_must_not_claim_H3
  - no_default_license_dependent_components
  - one_project_one_authoritative_BIM
  - no_install_or_mutation_during_research
  - each_provider_must_have_measured_AC29_contract
  - avoid_full_ModelDump_in_hot_path
experiment_queue:
