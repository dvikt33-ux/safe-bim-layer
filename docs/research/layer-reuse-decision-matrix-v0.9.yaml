version: 0.9
date: 2026-10-08
target: Archicad_29
status: active_research
supersedes: docs/research/layer-reuse-decision-matrix-v0.8.yaml

graph_source_priority:
  1_archicad_native_authoritative:
    - host_owner
    - wall_beam_connections
    - zone_boundaries_relations
    - opening_parent_cut
    - solid_element_operations
    - roof_shell_trims
    - hierarchical_ownership
    - hotlink_source_proxy
    - mep_connectivity_systems
    - story_view_drawing_relations
  2_sbim_explicit_intent_legal:
    - design_intent
    - normative_applicability
    - design_decisions
    - acp_governance
    - approved_substitutions
    - coordination_policy
  3_derived_semantic:
    - repeated_module
    - same_type_favorite
    - repeated_room_pattern
    - likely_detail_family
    - documentation_dependency
    - validity_envelope
  4_spatial_inference_cold_fallback:
    - collision
    - nearest_neighbor
    - geometric_adjacency
    - reconstructed_topology

archicad_native_graph:
  element_relations:
    wall_beam:
      - begin_end_connections
      - reference_line_connections
      - crossing_intersection
      - connection_polygon
    zone:
      - related_elements_by_type
      - wall_boundary_parts
      - beam_boundary_parts
      - curtain_wall_boundary_parts
      - windows_doors
      - slabs_roofs_shells
      - stairs_railings_and_parts
    opening:
      - parent
      - cut_elements
      - connected_openings
    geometry_relations:
      - seo_operator_target
      - roof_shell_trim
      - merge
    hierarchy:
      - curtain_wall
      - stair
      - railing
      - beam
      - column
    hotlink:
      - source_proxy_guid_mapping

mep_native:
  distribution_systems_graph:
    since: Archicad_28
    authoritative_semantics:
      - connected_set
      - common_system_category
      - common_domain
    provides:
      - systems
      - elements
      - ports
      - tree_traversal
      - previous_next
      - direct_connected_element_ids
  physical_system:
    since: Archicad_29
    persisted_in_pln: true
    stores:
      - name
      - root_element
      - calculation_point
      - system_category
      - group
    role: persistent_mep_design_intent_anchor
  custom_generic_mep_topology: blocked

stair_native_solver:
  api: ACAPI_HierarchicalEditing_SolveStair
  outcomes:
    - Correct
    - Solved
    - NotSolved
  rules_data:
    - riser_height_min_max
    - tread_depth_min_max
    - two_risers_plus_going
    - landing_length
    - walking_line_and_winder
    - riser_going_relations
    - pitch
  headroom_separate: true
  architecture:
    - verified_russian_rule_ir
    - compile_supported_numeric_subset_to_native_rules
    - native_solve
    - readback
    - independent_full_rule_verification
  custom_stair_geometry_solver: blocked_pending_native_test

open_connector_davidharutyunyan:
  repository: davidharutyunyan/archicad-mcp-connector
  observed_commit: b2a9a825d57ae9f4d0b50f66a7e413c1c0f2fff0
  observed_date: 2026-10-01
  license: MIT
  current_host: Archicad_26
  runtime_status: SOURCE_HARVEST_NOT_AC29_BINARY_DEPENDENCY
  advertised:
    mcp_tools_approx: 260
    tool_families: 21
    extra_addon_json_commands_approx: 170
    unit_tests: 574
    live_checks: 413
  harvest:
    - deep_geometry_contract
    - native_relation_extractor
    - stair_railing_schema
    - strict_zod_schemas
    - toolset_presets
    - capture_view_verification
    - tests
    - undo_wrapper_patterns
  safety:
    unknown_fields_rejected: true
    delta_transforms_non_idempotent_annotation: true
    undo_wrapper_rolls_back_on_escaping_error: true
    generic_create_modify_batch_all_or_none: false
    reason: per_item_Try_swallows_item_errors_inside_single_undo_scope

deep_geometry:
  current_ac29_baseline: model_dump_v1
  algorithmic_uniqueness: false
  open_source_contract_found: true
  open_contract_fields:
    summary:
      - body_count
      - vertex_count
      - edge_count
      - polygon_count
      - world_bbox
      - material_summary
    mesh:
      - source_guid
      - body_index
      - world_vertices
      - polygon_topology
      - holes
      - body_material
      - polygon_material_override
      - world_normal
      - closed_curved
  target_architecture:
    milestone_debug: full_model_dump
    routine_cold: on_demand_per_element_summary_or_mesh
  retire_model_dump: false

element_link:
  api_family: ACAPI_ElementLink
  purpose: addon_specific_element_association
  guid_change_tracking_by_archicad: true
  recommended_use:
    - acp_instance_to_host_anchor
    - decision_anchor_to_bim_element
    - verification_anchor_to_bim_element
  not_for:
    - entire_canonical_graph
    - rich_provenance
    - legal_rule_graph
    - many_to_many_semantics
  adoption_gate: ELEMENTLINK_01

tool_context_strategy:
  layer_1: coarse_tool_family_preset
  layer_2: semantic_retrieval
  layer_3: expose_top_3_to_5_capabilities

custom_core_after_native_harvest:
  keep:
    - russian_legal_currentness_applicability
    - design_intent
    - design_decision_records
    - rule_compilation_and_provenance
    - coverage_signatures
    - semantic_facet_fingerprints
    - incremental_dependency_compiler
    - change_pruning
    - provider_capability_contract
    - action_cache
    - cross_provider_scheduling
    - project_specific_disruption_ranking
    - proven_ac29_native_gaps
  remove_or_block_generic_ownership:
    - generic_bim_relation_discovery
    - generic_mep_topology
    - generic_stair_geometry_solver
    - generic_per_element_3d_extraction_algorithm
    - generic_element_transforms
    - event_recovery_single_source_of_truth
    - generic_tool_family_discovery

new_tests:
  NATIVE_GRAPH_01:
    - native_vs_geometric_relation_precision
    - native_vs_geometric_relation_completeness
    - runtime
  MEP_GRAPH_01:
    - systems
    - ports
    - traversal
    - direct_connections
    - physical_system_persistence
  STAIR_SOLVER_01:
    - correct
    - solved
    - not_solved
    - readback
    - headroom
    - independent_rule_check
  GEOM_HARVEST_01:
    - model_dump_vs_ported_open_contract
  OPEN_CONNECTOR_29_PORT_01:
    - relations
    - geometry_summary_mesh
    - stair_railing_schema
    - test_fixtures
  ELEMENTLINK_01:
    - save_reopen
    - guid_tracking
    - delete
    - undo_redo
    - copy_hotlink
    - teamwork

governing_rule: use_archicad_native_semantics_before_derived_or_geometric_inference