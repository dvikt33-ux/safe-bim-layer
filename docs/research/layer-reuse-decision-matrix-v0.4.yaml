version: 0.4
date: 2026-10-08
target: Archicad_29
status: active_research
supersedes: docs/research/layer-reuse-decision-matrix-v0.3.yaml

decision_change:
  previous_primary_execution_hypothesis: huskybim_first_native_gap_second
  new_primary_execution_hypothesis: tapir_open_substrate_then_open_mcp_wrapper_then_residual_native_gap_then_husky_comparison
  reason:
    - exact_project_tapir_commit_already_contains_broad_create_modify_commands
    - open_mcp_wrappers_now_cover_schema_discovery_validation_safety_and_qa
    - closed_runtime_dependency_should_only_be_added_if_it_beats_open_baseline

decisions:
  tapir_archicad_automation:
    action: TAKE_AS_PRIMARY_OPEN_EXECUTION_SUBSTRATE_PENDING_LIVE_BENCHMARK
    upstream: ENZYME-APD/tapir-archicad-automation
    project_known_commit: d2dfeec7936dd1dbed4e2412f406b30291959c26
    project_known_commit_date: 2026-09-29
    latest_release_observed:
      version: 1.7.0
      published: 2026-10-04
    confirmed_at_project_known_commit:
      create:
        - windows
        - doors
        - openings
        - morphs
        - roofs
      modify:
        - windows
        - doors
        - morphs
        - roofs
      roof:
        read:
          - roof_class
          - structure_type
          - thickness
          - level
          - z_coordinate
          - building_material
          - composite
          - angle
          - pivot_line
          - polygon
          - holes
        write:
          - create_single_plane
          - create_multi_plane
          - building_material
          - composite
          - thickness
          - level
          - polygon
          - multi_plane_modify
        limitation:
          - modify_roofs_is_multi_plane_only_at_inspected_revision
      morph:
        read:
          - transform
          - building_material
          - default_surface
          - arbitrary_body_vertices_faces
          - per_face_surface
        write:
          - box_create
          - arbitrary_body_create
          - whole_body_replace
          - translation
          - rotation_z
          - building_material
          - default_surface
          - per_face_surface
    roadmap_effect:
      - search_tapir_before_every_new_native_command
      - stop_generic_writer_work_when_overlap_exists
      - make_existing_native_cycles_comparative_test_fixtures

  archicad_mcp_alesdev88:
    action: WRAP_OR_USE_METHOD_FOR_SAFETY_QA
    upstream: alesdev88/Archicad-MCP
    latest_release_observed:
      version: v0.7.1
      published: 2026-09-30
    strengths:
      - archicad_29_specific
      - official_json_plus_tapir_gateway
      - curated_create_read_write_tools
      - yaml_qa_rules
      - dry_run_default
      - explicit_confirm_for_destructive_writes
      - changeset_preview
      - project_identity_guard
      - one_shot_expiring_changeset
      - post_apply_readback_reporting
      - bcf_and_issues
      - publish
      - schedule_xml_tools
      - whole_plan_coverage_awareness
    limitations:
      - changeset_not_atomic
      - partial_success_remains_applied_on_later_failure
      - optional_scripts_are_unsandboxed_python
      - AC29_property_value_read_can_crash_archicad
    roadmap_effect:
      - pause_custom_generic_preflight_ui_until_evaluated
      - reuse_or_wrap_dry_run_and_changeset_semantics
      - never_treat_property_read_ceiling_as_crash_fix

  tapir_archicad_mcp_szamosi:
    action: TAKE_AS_MCP_SURFACE_CANDIDATE
    upstream: SzamosiMate/tapir-archicad-MCP
    latest_release_observed:
      version: v0.6.3
      published: 2026-10-03
    strengths:
      - generated_tools_from_tapir_and_official_schemas
      - 191_plus_commands_advertised
      - pydantic_runtime_validation
      - progressive_tool_discovery
      - exact_schema_lookup
      - multi_instance
      - stdio
      - sse
      - streamable_http
      - bearer_token_for_http
      - long_running_job_handles
      - broad_element_create_modify_surface
    limitations:
      - cancellation_does_not_stop_started_archicad_command
      - retry_after_lost_response_can_duplicate_writes
      - job_state_lost_on_server_restart
      - no_atomic_transaction_semantics
    roadmap_effect:
      - stop_custom_generic_mcp_command_registry
      - stop_custom_schema_discovery_layer_unless_gap_proven

  archicad_mcp_boti_ormandi:
    action: USE_METHOD_NOT_PRODUCTION_RUNTIME
    upstream: Boti-Ormandi/archicad-mcp
    strengths:
      - four_tool_compact_surface
      - exact_command_documentation_discovery
      - property_discovery
      - multi_step_local_execution
      - reduced_context_tool_explosion
    blocker:
      - execute_script_is_unsandboxed_python_as_os_user
    reuse:
      - progressive_discovery
      - compact_tool_surface
      - exact_schema_lookup

  chronista_native_archicad_mcp:
    action: BENCHMARK_ONLY
    upstream: chronista-club/archicad-mcp
    strengths:
      - native_cpp_addon
      - local_socket_bridge
      - rust_mcp_server
      - architecture_matches_thin_native_bridge_pattern
    blocker:
      - current_public_tool_surface_is_tiny
      - not_a_broad_execution_replacement

  huskybim_archicad29:
    action: BENCHMARK_PARALLEL_NOT_PRIMARY_BY_DEFAULT
    public_claim_conflict:
      values:
        - 687
        - 733
    broad_domains:
      - elements
      - geometry
      - attributes
      - layers
      - classifications
      - properties
      - stories
      - layouts
      - drawings
      - bcf
      - issues
    reason_for_repositioning:
      - open_tapir_stack_is_now_known_to_be_broad
      - open_stack_is_inspectable_and_versionable
      - closed_dependency_requires_measurable_incremental_value
    adoption_gate:
      must_win_on_one_or_more:
        - missing_api_coverage
        - reliability
        - performance
        - safer_write_semantics
        - documentation_production
        - easier_client_integration
        - maintenance_cost

  archi_automate:
    action: WRAP_OPTIONAL
    best_for:
      - cross_host_mcp
      - qgis
      - ifc
      - ids
      - bcf
      - client_hub
      - guardrails
    primary_archicad_executor: false

  graphisoft_public_mcp:
    action: DEFER_AC30

  nemetschek_creator:
    action: DEFER_AC30

  swapp_frank:
    action: BENCHMARK_ONLY

  delta_flow:
    action: BENCHMARK_ONLY

  text2bim:
    action: USE_METHOD
    reuse:
      - planner_designer_executor_separation
      - bounded_tool_set
      - independent_checker
      - bcf_feedback
      - reviewer_repair_loop
      - experiment_logging
    do_not_port:
      - freeform_generated_python_execution

  design_healing:
    action: USE_METHOD_BASELINE
    pipeline:
      - graph_topological_propagation
      - progressive_scope_expansion
      - morris_sensitivity_screening
      - conditioned_latin_hypercube
      - compliance_black_box
      - weighted_distance_ranking

  ifc_agent:
    action: USE_METHOD
    reuse:
      - adaptive_dual_mode_execution
      - sample_infer_then_deterministic_batch
      - procedural_memory
      - entity_semantic_cache

  code_companion:
    action: USE_METHOD
    safety_rule: LLM_draft_cannot_become_ACTIVE_without_verification

  building_information_graphs:
    action: USE_SCHEMA_REFERENCE

native_gap_after_overlap_audit:
  keep_until_disproven:
    - native_element_change_observer
    - project_revision_and_stale_operation_guard
    - evaluated_deep_geometry_not_equivalent_to_tapir_output
    - face_material_or_surface_provenance_if_not_available_upstream
    - atomic_or_single_undo_transaction_semantics_if_not_available_upstream
    - exact_readback_only_for_uncovered_data
    - performance_instrumentation
  remove_from_presumed_ownership:
    - generic_window_create_modify
    - generic_door_create_modify
    - generic_opening_create
    - generic_roof_create
    - generic_roof_building_material_write
    - generic_roof_composite_write
    - generic_multiplane_roof_modify
    - generic_morph_create
    - generic_morph_translation
    - generic_morph_material_write
    - generic_morph_default_surface_write
    - generic_morph_arbitrary_body_create_replace
    - generic_mcp_tool_registry
    - generic_tapir_schema_discovery

custom_scope_after_audit:
  keep:
    - residual_execution_capability_map
    - native_event_revision_deep_geometry_gap_bridge
    - canonical_project_kernel
    - russian_normative_source_federation
    - russian_legal_applicability_semantics
    - rule_ir_project_bindings
    - design_healing_project_disruption_extensions
    - thin_router
  pause_pending_benchmark:
    - large_custom_execution_adapter
    - custom_preflight_changeset_ui
    - broad_custom_readback_layer
  stop_or_defer:
    - overlapping_native_generic_writers
    - generic_archicad_crud_platform
    - generic_multi_host_mcp_gateway
    - generic_ifc_parser
    - generic_ids_validator
    - generic_clash_engine
    - generic_solver
    - generic_agent_framework
    - custom_healing_search_from_scratch
    - llm_reasoning_per_every_element
    - giant_early_design_generator
    - universal_bim_ontology

mandatory_development_rule:
  before_new_native_archicad_command:
    - search_exact_current_tapir_command_list
    - inspect_tapir_schema_and_source
    - inspect_open_mcp_wrappers
    - run_live_capability_test
    - implement_custom_only_if_gap_is_proven

tests:
  TEST_TAPIR_01:
    priority: 1
    goal: compare_existing_native_live_cycles_against_project_tapir_revision
    operations:
      - wall
      - hosted_window
      - hosted_door
      - opening
      - slab
      - roof_create
      - roof_material_and_composite
      - roof_modify
      - morph_box
      - morph_arbitrary_body
      - morph_default_surface
      - morph_per_face_surface
      - morph_translation
      - stories
      - properties_classifications
      - layouts_drawings
      - batch_100

  TEST_TAPIR_02:
    priority: 2
    goal: compatibility_test_tapir_1_7_0_on_scratch_project

  TEST_MCP_01:
    priority: 3
    goal: compare_open_mcp_wrappers
    candidates:
      - alesdev88_Archicad_MCP
      - SzamosiMate_tapir_archicad_MCP
      - Boti_Ormandi_archicad_mcp
    dimensions:
      - tool_discovery
      - schema_fidelity
      - context_cost
      - dry_run
      - confirmation
      - readback
      - project_identity
      - retry_idempotency
      - authentication
      - long_running_jobs
      - failure_reporting

  TRANSACTION_01:
    priority: 4
    goal: prove_failure_undo_retry_stale_and_active_window_semantics

  BIM_EXEC_01:
    priority: 5
    goal: compare_husky_against_verified_open_stack_and_residual_native_gap

  READBACK_01:
    priority: 6
    goal: determine_which_native_model_dump_outputs_are_not_equivalent_to_tapir

  HEAL_01:
    goal: reproduce_design_healing_baseline

  RULE_IR_01:
    goal: encode_one_verified_SP_rule_deterministically

  AGENT_01:
    goal: planner_executor_checker_repair_with_dual_memory
