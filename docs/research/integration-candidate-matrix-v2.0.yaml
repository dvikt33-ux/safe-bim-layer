requirements_model:
  PRE:
    name: Program_Requirement_Envelope
    custom_normalized_schema: true
    scope:
      - function_hierarchy
      - population
      - area_budget
      - room_counts
      - relationship_graph
      - operational_flows
      - security_privacy
      - shared_resources
      - normative_refs

  RRE:
    name: Room_Requirement_Envelope
    custom_normalized_schema: true
    not_geometry: true
    fields:
      - min_target_max_area
      - min_dimensions
      - proportion
      - ceiling
      - facade_daylight
      - occupancy_activities
      - equipment
      - operational_clearance
      - access_accessibility
      - environment
      - MEP_services
      - loads
      - finishes
      - fire_security
      - relationships
      - source_evidence

  FRG:
    name: Functional_Relationship_Graph
    desired_graph: true
    edge_types:
      - adjacency
      - near
      - far
      - anti_adjacency
      - visibility
      - acoustic_separation
      - security_transition
      - public_flow
      - staff_flow
      - goods_flow
      - waste_dirty_flow
      - emergency_flow
      - maintenance_flow
      - vertical_stack

realized_spatial_graph:
  source:
    - archicad_native_semantics
    - TopologicPy
    - geometry_fallback
  compare_to_FRG: true
  outputs:
    - PASS
    - MARGIN
    - FAIL

area_semantics:
  programmed_area: REQUIREMENT
  designed_area: MEASURED_FROM_ACTUAL_GEOMETRY
  direct_set_actual_area_operation: FORBIDDEN
  area_change_requires_geometry_change: true

fit_gate:
  area_only_sufficient: false
  required:
    - polygon_proportion
    - equipment_fit
    - operating_clearance
    - door_access
    - internal_circulation
    - accessibility
    - environment_services
    - facade_window
    - structural_mep_clearance

flow_analysis:
