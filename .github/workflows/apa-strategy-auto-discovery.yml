name: APA Source-qualified Native Strategy Auto-discovery
on:
  pull_request:
    paths:
      - "scripts/archicad_strategy_discovery.py"
      - "tests/test_apa_strategy_discovery.py"
      - ".github/workflows/apa-strategy-auto-discovery.yml"
      - "scripts/apa_install_strategy_discovery.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auto-strategy-select:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "jsonschema>=4,<5" "unified-planning[fast-downward]==1.3.0"
      - run: python -m py_compile scripts/archicad_strategy_discovery.py tests/test_apa_strategy_discovery.py
      - run: python -m unittest discover -s tests -p "test_apa_strategy_discovery.py" -v
      - run: python -m unittest discover -s tests -p "test_apa_execution_optimizer.py" -v
      - run: python -m unittest discover -s tests -p "test_apa_copy_first_native.py" -v
