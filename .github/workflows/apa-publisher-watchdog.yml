name: APA Publisher on-demand health diagnostic

# Scheduled workflows run from the repository default branch (main), which
# APA policy forbids changing. A cron in this research branch would be inert.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/apa_publisher/watchdog.py'
      - 'tools/apa_publisher/tests/test_watchdog.py'
      - '.github/workflows/apa-publisher-watchdog.yml'

permissions:
  actions: read
  contents: read

concurrency:
  group: apa-publisher-canonical-watchdog
  cancel-in-progress: true

jobs:
  offline-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline Publisher monitoring tests
        run: python -m unittest discover -s tools/apa_publisher/tests -p 'test_watchdog.py' -v
      - name: Compile watchdog
        run: python -m py_compile tools/apa_publisher/watchdog.py

  monitor:
    if: github.event_name != 'pull_request' && github.repository == 'dvikt33-ux/safe-bim-layer' && github.ref == 'refs/heads/research/apa-verified-results-hub-20261010'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/apa-verified-results-hub-20261010
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check the canonical Publisher latest run
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/apa_publisher/watchdog.py --max-active-minutes 45
