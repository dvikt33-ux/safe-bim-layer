name: APA Publisher watchdog offline contracts

# GitHub schedule/workflow_dispatch require a workflow on default branch.
# APA policy forbids changing main. This PR ONLY verifies the reusable
# read-only watchdog module; it does not claim a scheduled deployment.
on:
  pull_request:
    paths:
      - 'tools/apa_publisher/watchdog.py'
      - 'tools/apa_publisher/tests/test_watchdog.py'
      - '.github/workflows/apa-publisher-watchdog.yml'

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline Publisher monitoring tests
        run: python -m unittest discover -s tools/apa_publisher/tests -p 'test_watchdog.py' -v
      - name: Compile watchdog
        run: python -m py_compile tools/apa_publisher/watchdog.py
