name: APA AC29 Guarded Save Isolation Source Gates
on:
  pull_request:
    paths:
      - "scripts/apa_ac29_save_isolation.py"
      - "scripts/apa_ac29_hotlink_batch_oneshot.py"
      - "tests/test_apa_ac29_save_isolation.py"
      - ".github/workflows/apa-ac29-guarded-save-isolation.yml"
      - "docs/APA_AC29_GUARDED_SAVE_ISOLATION_RU.md"
permissions:
  contents: read
jobs:
  isolate-native-save:
    runs-on: windows-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install existing schema-test dependency only
        run: python -m pip install "jsonschema>=4,<5"
      - name: Compile new file-level protection and caller
        run: |
          python -m py_compile scripts/apa_ac29_save_isolation.py scripts/apa_ac29_hotlink_batch_oneshot.py
          python -m py_compile tests/test_apa_ac29_save_isolation.py
      - name: Verify fail-closed scratch lease and exact saved snapshot
        run: python -m unittest discover -s tests -p "test_apa_ac29_save_isolation.py" -v
      - name: Verify existing batch geometry/writer contracts unchanged
        run: |
          python -m unittest discover -s tests -p "test_apa_ac29_hotlink_batch_geometry.py" -v
          python -m unittest discover -s tests -p "test_apa_ac29_hotlink_batch_writer.py" -v
      - name: Confirm CI did not access native Archicad or write PLN
        run: |
          python -c "from pathlib import Path; s=Path('scripts/apa_ac29_save_isolation.py').read_text(); assert 'native_transport' not in s and 'BYTE_EXACT_GUARDED_SAVE_SNAPSHOT_CAPTURED' in s; print('OFFLINE SOURCE ONLY: no native calls')"
