name: Build details v2.12 KAIMAN exact 47-sheet integration
on:
  push:
    branches: [feature/working-archicad-mvp]
    paths:
      - details/tools/build_v212_kaiman_exact47.py
      - details/import/kaiman-exact-v2.5/**
      - .github/workflows/build-details-v212-kaiman-exact47.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/working-archicad-mvp
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build audited v2.12
        run: python details/tools/build_v212_kaiman_exact47.py
      - name: Commit generated v2.12
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add details .github/workflows
          git diff --cached --stat
          git diff --cached --quiet && exit 0
          git commit -m "Integrate KAIMAN exact sheets 1-47 in v2.12 [details-v2.12]"
          git push origin HEAD:feature/working-archicad-mvp