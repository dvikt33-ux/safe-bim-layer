name: APA IFC reports B1 source contracts
on:
  pull_request:
    paths:
      - scripts/apa_ifc_reports_b1.py
      - tests/test_apa_ifc_reports*.py
      - .github/workflows/apa-ifc-reports-b1.yml
permissions:
  contents: read
jobs:
  source-contracts:
    runs-on: windows-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m py_compile scripts/apa_ifc_reports_b1.py tests/test_apa_ifc_reports_b1.py
      - run: python -m unittest discover -s tests -p "test_apa_ifc_reports_contracts.py" -v
      - run: python -m unittest discover -s tests -p "test_apa_high_density*.py" -v
