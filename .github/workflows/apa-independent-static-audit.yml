name: APA independent all-source static audit
on:
  push:
    branches:
      - 'feature/apa-connected-independent-offline-*'
    paths:
      - '.github/workflows/apa-independent-static-audit.yml'
permissions:
  contents: read
jobs:
  source-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'PyYAML>=6,<7'
      - name: Parse all tracked Python, JSON, YAML source files
        shell: bash
        run: |
          python - <<'PY'
          import ast
          import json
          import pathlib
          import subprocess
          import sys
          import yaml

          tracked = subprocess.check_output(['git','ls-files','-z']).decode('utf-8').strip('\0').split('\0')
          counts = {'py': 0, 'json': 0, 'yaml': 0}
          failures = []
          for name in tracked:
              path = pathlib.Path(name)
              if path.suffix not in {'.py', '.json', '.yaml', '.yml'}:
                  continue
              try:
                  data = path.read_text(encoding='utf-8')
                  if path.suffix == '.py':
                      ast.parse(data, filename=name)
                      counts['py'] += 1
                  elif path.suffix == '.json':
                      json.loads(data)
                      counts['json'] += 1
                  else:
                      list(yaml.safe_load_all(data))
                      counts['yaml'] += 1
              except Exception as exc:
                  failures.append(f'{name}: {type(exc).__name__}: {exc}')
          print('ALL_TRACKED_SOURCE_AUDIT', json.dumps(counts, sort_keys=True))
          for failure in failures:
              print('STATIC_FAIL', failure)
          if failures:
              print('FAIL_COUNT', len(failures))
              sys.exit(1)
          print('ALL_TRACKED_STATIC_PASS')
          PY
