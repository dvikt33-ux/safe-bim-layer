name: APA Copy First Native MoveElements
on:
  pull_request:
    paths:
      - "scripts/archicad_dynamic_commands.py"
      - "tests/test_apa_copy_first_native.py"
      - "tests/test_apa_copy_first_install.py"
      - "scripts/apa_install_native_copy_features.py"
      - ".github/workflows/apa-native-copy-first.yml"
  workflow_dispatch:
jobs:
  native-routing-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile scripts/archicad_dynamic_commands.py scripts/apa_install_native_copy_features.py
      - run: python -m unittest discover -s tests -p test_apa_copy_first_native.py -v
      - run: python -m unittest discover -s tests -p test_apa_copy_first_install.py -v
