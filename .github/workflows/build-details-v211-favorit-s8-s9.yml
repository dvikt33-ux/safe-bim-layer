name: Build details v2.11 FAVORIT sections 8-9 binding
on:
  push:
    branches: [feature/working-archicad-mvp]
    paths:
      - details/tools/build_v211_favorit_s8_s9.py
      - .github/workflows/build-details-v211-favorit-s8-s9.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/working-archicad-mvp
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build audited v2.11
        run: python details/tools/build_v211_favorit_s8_s9.py
      - name: Commit generated v2.11
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add details .github/workflows
          git diff --cached --stat
          git diff --cached --quiet && exit 0
          git commit -m "Resolve FAVORIT sections 8-9 source-binding queue in v2.11 [details-v2.11]"
          git push origin HEAD:feature/working-archicad-mvp