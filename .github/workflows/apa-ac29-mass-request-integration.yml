name: APA AC29 Mass Request Integration
on:
  pull_request:
    paths:
      - "scripts/apa_ac29_mass_request.py"
      - "scripts/apa_ac29_group_batch_oneshot.py"
      - "scripts/apa_ac29_native_group_grid.py"
      - "scripts/apa_ac29_group_strategy.py"
      - "scripts/apa_ac29_native_group_clone_verifier.py"
      - "scripts/archicad_project_accelerator.py"
      - "tests/test_apa_ac29_mass_request.py"
      - "tests/test_apa_ac29_line_segment.py"
      - "tests/test_apa_ac29_selected_axes.py"
      - "scripts/apa_ac29_native_group_create.py"
      - "schemas/accelerator/native-group-create.json"
      - "tests/test_apa_ac29_native_group_create.py"
      - "scripts/apa_ac29_group_create_oneshot.py"
      - "tests/test_apa_ac29_group_create_oneshot.py"
      - "scripts/apa_ac29_native_group_ungroup.py"
      - "schemas/accelerator/native-group-ungroup.json"
      - "tests/test_apa_ac29_native_group_ungroup.py"
      - "scripts/apa_ac29_native_group_move.py"
      - "schemas/accelerator/native-group-move.json"
      - "tests/test_apa_ac29_native_group_move.py"
      - "scripts/apa_ac29_group_intent.py"
      - "tests/test_apa_ac29_group_intent.py"
      - "tests/test_apa_ac29_group_batch_oneshot.py"
      - "scripts/apa_install_mass_selector.py"
      - "scripts/apa_ac29_installed_*.py"
      - "schemas/accelerator/installed-group-copy.json"
      - "tests/test_apa_ac29_installed_mass_selector.py"
      - "scripts/apa_ac29_native_copy_verifier.py"
      - "scripts/apa_ac29_copy_batch_oneshot.py"
      - "scripts/apa_ac29_dynamic_native_verifiers.py"
      - "tests/test_apa_ac29_native_copy_verifier.py"
      - "tests/test_apa_ac29_native_slab_copy.py"
      - "tests/test_apa_ac29_copy_batch_oneshot.py"
      - "scripts/apa_update_copy_registry.py"
      - "tests/test_apa_ac29_copy_registry_update.py"
      - "tests/test_apa_ac29_existing_create_verifiers.py"
      - "scripts/archicad_dynamic_commands.py"
      - ".github/workflows/apa-ac29-mass-request-integration.yml"
permissions:
  contents: read
jobs:
  existing-native-route:
    runs-on: windows-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install "jsonschema>=4,<5"
      - name: Existing Router and code-owned group contracts; no native API
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $suites = @('save_isolation','hotlink_batch_geometry','hotlink_batch_writer','native_group_grid','native_group_writer_integration','group_grid_live_8x4','group_scenewriter_sqlite_audit','group_strategy_integration','mass_request','line_segment','group_batch_oneshot','installed_mass_selector','native_copy_verifier','native_slab_copy','copy_batch_oneshot','multi_prototype_native_copy','copy_registry_update','existing_create_verifiers')
          foreach ($suite in $suites) {
            python -m unittest discover -s tests -p "test_apa_ac29_$suite.py" -v
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          python -m unittest discover -s tests -p "test_apa_ac29_selected_axes.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p "test_apa_ac29_native_group_create.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p "test_apa_ac29_group_create_oneshot.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p "test_apa_ac29_native_group_ungroup.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p "test_apa_ac29_native_group_move.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p "test_apa_ac29_group_intent.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p "test_archicad_dynamic_commands.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
