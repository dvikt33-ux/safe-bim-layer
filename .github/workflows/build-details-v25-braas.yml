name: Build details v2.5 BRAAS deepening

on:
  push:
    branches: [feature/working-archicad-mvp]
    paths:
      - details/tools/build_v25_braas.py
      - .github/workflows/build-details-v25-braas.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/working-archicad-mvp
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build audited v2.5
        run: python details/tools/build_v25_braas.py
      - name: Commit generated v2.5
        run: |
          rm -f details/tools/inspect_braas_v24.py .github/workflows/inspect-braas-v24.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add details .github/workflows
          git diff --cached --stat
          git diff --cached --quiet && exit 0
          git commit -m "Publish BRAAS-enriched detail machine library v2.5 [details-v2.5]"
          git push origin HEAD:feature/working-archicad-mvp
