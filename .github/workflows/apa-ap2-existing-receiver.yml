name: APA AP2 Existing Receiver Read-Only Extension
on:
  push:
    branches:
      - feature/apa-ap2-same-autonomous-receiver-20261018
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        py: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.py }}
      - name: Compile pinned existing-worker extension
        run: python -m py_compile scripts/apa_ac29_autonomous_job_bridge.py scripts/install_apa_ap2_same_receiver_readonly.py tests/test_apa_ap2_same_receiver.py
      - name: Validate strict no-write AP2 read-only target
        run: python -m unittest discover -s tests -p test_apa_ap2_same_receiver.py -v
