name: Inspect BRAAS v2.4 schema
on:
  push:
    branches: [feature/working-archicad-mvp]
    paths: [details/tools/inspect_braas_v24.py]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/working-archicad-mvp
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python details/tools/inspect_braas_v24.py
