name: APA massive parallel offline QA

on:
  pull_request:
    paths:
      - 'scripts/apa_parallel_unittest_shard.py'
      - 'scripts/apa_parallel_offline_aggregate.py'
      - 'scripts/apa_repo_offline_static_audit.py'
      - 'tests/test_archicad_independent_provider_audit.py'
      - '.github/workflows/apa-mass-parallel-offline.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-shards:
    name: Offline unittest shard ${{ matrix.shard }} of 8
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      APA_OFFLINE_ONLY: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install already used offline dependencies
        run: |
          python -m pip install 'jsonschema>=4,<5'
          python -m pip install -r scripts/requirements-connected.txt
          python -m pip install -r scripts/requirements-knowledge.txt
      - name: Run each discovered test in exactly one shard
        run: python scripts/apa_parallel_unittest_shard.py --shard ${{ matrix.shard }} --shards 8 --report reports/shard-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apa-offline-shard-${{ matrix.shard }}
          path: reports/shard-${{ matrix.shard }}.json
          if-no-files-found: warn

  upstream-graph:
    name: Upstream Knowledge Graph tests
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      APA_OFFLINE_ONLY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install graph dependencies
        run: |
          python -m pip install 'jsonschema>=4,<5'
          python -m pip install -r scripts/requirements-connected.txt
          python -m pip install -r scripts/requirements-knowledge.txt
      - uses: actions/checkout@v4
        with:
          ref: research/apa-verified-results-hub-20261010
          path: knowledge-corpus
      - run: python -m unittest discover -s knowledge-corpus/tools/apa_knowledge_graph/tests -v

  core-integration:
    name: Existing graph / MCP stdio / contracts
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      APA_OFFLINE_ONLY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing offline dependencies
        run: |
          python -m pip install 'jsonschema>=4,<5'
          python -m pip install -r scripts/requirements-connected.txt
          python -m pip install -r scripts/requirements-knowledge.txt
      - uses: actions/checkout@v4
        with:
          ref: research/apa-verified-results-hub-20261010
          path: knowledge-corpus
      - run: python scripts/apa_knowledge_integration_smoke.py --corpus knowledge-corpus --output knowledge-smoke-result
      - run: python scripts/archicad_batch_contracts.py --runtime-version 1.5.8
      - run: python scripts/archicad_bim_graph.py examples/archicad_bim_graph.offline.sample.json --runtime-version 1.5.8

  tracked-source-audit:
    name: All tracked Python / JSON / PowerShell syntax
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Parse all tracked Python and JSON files
        run: python scripts/apa_repo_offline_static_audit.py
      - name: Parse all tracked PowerShell scripts
        if: always()
        shell: pwsh
        run: |
          $paths = @(git ls-files -- '*.ps1')
          foreach ($path in $paths) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$path : $($_.Message)" }
              throw "PowerShell parse failed: $path"
            }
          }
          Write-Host "PARSED_ALL_POWERSHELL: $($paths.Count)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apa-tracked-source-audit
          path: reports/static-tracked-file-audit.json
          if-no-files-found: warn

  aggregate:
    name: Verify every test was assigned once
    needs: [test-shards, upstream-graph, core-integration, tracked-source-audit]
    if: always()
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: apa-offline-shard-*
          path: reports
          merge-multiple: true
      - name: Verify all eight shards and report exact result totals
        run: python scripts/apa_parallel_offline_aggregate.py --reports-dir reports --shards 8
      - name: Require non-shard categories to complete successfully
        env:
          SHARDS_RESULT: ${{ needs.test-shards.result }}
          GRAPH_RESULT: ${{ needs.upstream-graph.result }}
          CORE_RESULT: ${{ needs.core-integration.result }}
          STATIC_RESULT: ${{ needs.tracked-source-audit.result }}
        run: |
          python -c "import os,sys; keys=['SHARDS_RESULT','GRAPH_RESULT','CORE_RESULT','STATIC_RESULT']; values={k:os.environ.get(k) for k in keys}; print('APA_MATRIX_JOB_STATUS',values); sys.exit(0 if all(v=='success' for v in values.values()) else 1)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apa-full-offline-aggregate
          path: reports/full-offline-aggregate.json
          if-no-files-found: warn
