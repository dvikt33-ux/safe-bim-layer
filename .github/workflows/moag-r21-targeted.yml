name: MOAG R21 targeted contextual index crosswalk
on:
  pull_request:
    paths:
      - 'tools/moag_topology/contextual_crosswalk_r21.py'
      - 'tests/test_moag_crosswalk_r21.py'
      - 'docs/research/apa-results/moag/synthesis/r21/**'
      - '.github/workflows/moag-r21-targeted.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  r21-crosswalk:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install official pinned OR-Tools
        run: python -m pip install -r tools/moag_topology/requirements-r11.txt
      - name: Install verified official MiniZinc CP-SAT
        run: python tools/moag_topology/bootstrap_r11.py
      - name: Real R21 source-alias audit and six open identity alternatives
        run: python tools/moag_topology/contextual_crosswalk_r21.py --out moag-r21-targeted
      - name: Review original stage-index crosswalk and five identity UNSAT proofs
        run: python -m unittest discover -s tests -p test_moag_crosswalk_r21.py -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: moag-r21-crosswalk-${{ matrix.os }}
          path: moag-r21-targeted/
          if-no-files-found: error
          retention-days: 30
