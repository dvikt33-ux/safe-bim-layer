name: APA AC29 Native Group Grid (1..32) — Offline
on:
  push:
    branches:
      - feature/apa-ac29-group-grid-verified-20261018
    paths:
      - 'scripts/apa_ac29_native_group_grid.py'
      - 'scripts/apa_ac29_native_group_clone_verifier.py'
      - 'tests/test_apa_ac29_native_group_grid.py'
      - 'tests/test_apa_ac29_native_group_writer_integration.py'
      - '.github/workflows/apa-ac29-group-grid-offline.yml'
  pull_request:
    paths:
      - 'scripts/apa_ac29_native_group_grid.py'
      - 'scripts/apa_ac29_native_group_clone_verifier.py'
      - 'tests/test_apa_ac29_native_group_grid.py'
      - 'tests/test_apa_ac29_native_group_writer_integration.py'
      - '.github/workflows/apa-ac29-group-grid-offline.yml'
permissions:
  contents: read
jobs:
  grid-native-contracts:
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install original APA JSON schema validator
        shell: pwsh
        run: python -m pip install 'jsonschema>=4,<5'
      - name: Compile only new planner and expanded native verifier
        run: python -m py_compile scripts/apa_ac29_native_group_grid.py scripts/apa_ac29_native_group_clone_verifier.py
      - name: Group grid 1..32 and strict owned-BREP postflight regression
        run: python -m unittest discover -s tests -p 'test_apa_ac29_native_group_grid.py' -v
      - name: Preserve previous accepted SceneWriter group integration
        run: python -m unittest discover -s tests -p 'test_apa_ac29_native_group_writer_integration.py' -v
      - name: Preserve existing group-first router without duplicate engine
        run: python -m unittest discover -s tests -p 'test_apa_ac29_group_strategy_integration.py' -v
