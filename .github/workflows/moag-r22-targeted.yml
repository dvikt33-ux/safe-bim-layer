name: MOAG R22 targeted physical connectivity
on:
  pull_request:
    paths:
      - 'tools/moag_topology/physical_connectivity_r22.py'
      - 'tests/test_moag_connectivity_r22.py'
      - 'docs/research/apa-results/moag/synthesis/r22/**'
      - '.github/workflows/moag-r22-targeted.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  r22-connectivity:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install official pinned OR-Tools
        run: python -m pip install -r tools/moag_topology/requirements-r11.txt
      - name: Download hash-verified official portable MiniZinc (retry transient network faults)
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if python tools/moag_topology/bootstrap_r11.py; then
              exit 0
            fi
            rm -f .runtime/minizinc.zip .runtime/minizinc.tar.gz
            if [ "$attempt" -eq 3 ]; then
              echo "Official SHA256-verified MiniZinc unavailable after three attempts" >&2
              exit 1
            fi
            sleep $((attempt * 10))
          done
      - name: Real R22 source identity quotient and fourteen open alternatives
        run: python tools/moag_topology/physical_connectivity_r22.py --out moag-r22-targeted
      - name: Test graph preservation and source causal identity conflicts
        run: python -m unittest discover -s tests -p test_moag_connectivity_r22.py -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: moag-r22-connectivity-${{ matrix.os }}
          path: moag-r22-targeted/
          if-no-files-found: error
          retention-days: 30
