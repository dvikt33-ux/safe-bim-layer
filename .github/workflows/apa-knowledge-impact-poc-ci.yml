name: APA knowledge impact read-only POC CI

on:
  pull_request:
    branches:
      - research/apa-verified-results-hub-20261010
    paths:
      - 'tools/apa_knowledge_graph/**'
      - '.github/workflows/apa-knowledge-impact-poc-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  graph-offline-tests:
    if: github.repository == 'dvikt33-ux/safe-bim-layer'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout pull request (no write token)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing APA YAML dependency
        run: python -m pip install PyYAML==6.0.3 tiktoken==0.14.0
      - name: Run unit, negative and real plan regression tests
        run: python -m unittest discover -s tools/apa_knowledge_graph/tests -v
      - name: Build disposable graph from canonical plan
        run: |
          python tools/apa_knowledge_graph/graph.py build \
            --plan docs/research/apa-results/control/PROJECT_PLAN.json \
            --out "${RUNNER_TEMP}/apa-knowledge-index.json"
      - name: Build derived section index without changing source documents
        run: |
          python tools/apa_knowledge_graph/sections.py build \
            --root docs/research/apa-results \
            --out "${RUNNER_TEMP}/apa-sections.sqlite"
      - name: Search real research sections with source SHA readback
        run: |
          python tools/apa_knowledge_graph/sections.py search \
            --index "${RUNNER_TEMP}/apa-sections.sqlite" \
            --query "кровли" --source-class PROJECT_CONTROL --limit 3 --max-snippet 160
      - name: Read exact PR68 normative source bytes and build real field-to-task chain
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python tools/apa_knowledge_graph/machine_adapter.py \
            --index "${RUNNER_TEMP}/apa-knowledge-index.json" \
            --out "${RUNNER_TEMP}/apa-real-machine-chain.json" \
            --benchmark-plan docs/research/apa-results/control/PROJECT_PLAN.json \
            --change-field roof_slope_length_m --before 10 --after 12
      - name: Verify unified GPT gateway exact and multi-document lookup on actual APA
        run: |
          python tools/apa_knowledge_graph/gateway.py \
            --index "${RUNNER_TEMP}/apa-knowledge-index.json" \
            --plan docs/research/apa-results/control/PROJECT_PLAN.json \
            --query "APA-P70.A02.S02" --max-chars 850
          python tools/apa_knowledge_graph/gateway.py \
            --index "${RUNNER_TEMP}/apa-knowledge-index.json" \
            --plan docs/research/apa-results/control/PROJECT_PLAN.json \
            --query "ART-APA-RU-JUNCTION-NORMS ART-APA-CSE-RESEARCH" \
            --max-chars 1600
          python tools/apa_knowledge_graph/gateway.py \
            --index "${RUNNER_TEMP}/apa-knowledge-index.json" \
            --plan docs/research/apa-results/control/PROJECT_PLAN.json \
            --sections "${RUNNER_TEMP}/apa-sections.sqlite" \
            --repo-root . --query "кровли" --source-class PROJECT_CONTROL \
            --max-chars 1800 --limit 4
      - name: Query real APA normative artifact (bounded)
        run: |
          python tools/apa_knowledge_graph/graph.py artifact \
            --index "${RUNNER_TEMP}/apa-knowledge-index.json" \
            --id ART-APA-RU-JUNCTION-NORMS --limit 5
      - name: Join two real APA artifacts without full files
        run: |
          python tools/apa_knowledge_graph/multidoc.py \
            --index "${RUNNER_TEMP}/apa-knowledge-index.json" \
            --artifacts ART-APA-RU-JUNCTION-NORMS ART-APA-CSE-RESEARCH \
            --max-tasks 5
