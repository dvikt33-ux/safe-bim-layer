name: APA BDD114 One-shot Writer Contract

on:
  pull_request:
    paths:
      - "scripts/apa_bdd114_native_copy_save_once.py"
      - ".github/workflows/apa-bdd114-once-writer.yml"
  workflow_dispatch:

jobs:
  static-executor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile only new BDD114 native adapter
        run: python -m py_compile scripts/apa_bdd114_native_copy_save_once.py
      - name: Check CLI without project access
        run: python scripts/apa_bdd114_native_copy_save_once.py --help
