name: Build details v2.7 FAVORIT section 4 binding
on:
  push:
    branches: [feature/working-archicad-mvp]
    paths:
      - details/tools/build_v27_favorit_s4.py
      - .github/workflows/build-details-v27-favorit-s4.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/working-archicad-mvp
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build audited v2.7
        run: python details/tools/build_v27_favorit_s4.py
      - name: Commit generated v2.7
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add details .github/workflows
          git diff --cached --stat
          git diff --cached --quiet && exit 0
          git commit -m "Resolve FAVORIT section 4 source-binding queue in v2.7 [details-v2.7]"
          git push origin HEAD:feature/working-archicad-mvp
