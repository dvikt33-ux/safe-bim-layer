name: APA AC29 Native Hotlink OneShot source gates
on:
  pull_request:
    paths:
      - "scripts/apa_ac29_hotlink_native_verifiers.py"
      - "scripts/apa_ac29_hotlink_oneshot.py"
      - "tests/test_apa_ac29_hotlink_one_shot.py"
      - ".github/workflows/apa-ac29-native-hotlink-oneshot.yml"
permissions:
  contents: read
jobs:
  exact-native-contracts:
    runs-on: windows-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install existing APA schema validator for source contract tests
        run: python -m pip install "jsonschema>=4,<5"
      - name: Python syntax and source tests
        run: |
          python -m py_compile scripts/apa_ac29_hotlink_native_verifiers.py scripts/apa_ac29_hotlink_oneshot.py tests/test_apa_ac29_hotlink_one_shot.py
          python -m unittest discover -s tests -p "test_apa_ac29_hotlink_one_shot.py" -v
      - name: Native gate stays disabled in CI
        run: |
          python -c "from pathlib import Path; p=Path('scripts/apa_ac29_hotlink_oneshot.py').read_text(); assert '--execute' in p and 'guard_manifest(state)' in p and 'LIVE_SAVED_PENDING_REOPEN' in p; print('SOURCE_ONLY: no Archicad process or native write in CI')"
