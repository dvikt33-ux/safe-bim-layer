name: APA AC29 Reusable Native Copy

on:
  pull_request:
    paths:
      - "scripts/apa_ac29_reusable_native_copy.py"
      - "scripts/apa_ac29_scene_reconciliation.py"
      - "scripts/apa_ac29_autonomous_job_bridge.py"
      - "scripts/upgrade_apa_ac29_reusable_native_worker.py"
      - "tests/test_apa_ac29_reusable_native_copy.py"
      - ".github/workflows/apa-ac29-reusable-native-copy.yml"
  workflow_dispatch:

jobs:
  new-capability-only:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile only the new native-copy and reconciliation modules
        run: python -m py_compile scripts/apa_ac29_reusable_native_copy.py scripts/apa_ac29_scene_reconciliation.py scripts/apa_ac29_autonomous_job_bridge.py scripts/upgrade_apa_ac29_reusable_native_worker.py tests/test_apa_ac29_reusable_native_copy.py
      - name: Test only new source and no-replay contracts
        run: python -m unittest discover -s tests -p "test_apa_ac29_reusable_native_copy.py" -v
