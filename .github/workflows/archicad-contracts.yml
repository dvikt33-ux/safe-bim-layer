name: Offline Archicad schema contracts

on:
  push:
    branches:
      - 'chatgpt/schema-driven-*'
      - 'chatgpt/mailbox-graph-host-integration-*'
      - 'chatgpt/tapir-1510-offline-preflight-*'
      - 'chatgpt/whole-scene-v1-*'
    paths:
      - 'scripts/archicad_batch_contracts.py'
      - 'scripts/archicad_bim_graph.py'
      - 'scripts/archicad_mailbox_graph_adapter.py'
      - 'scripts/archicad_mailbox_wall_host.py'
      - 'scripts/archicad_scene_v1.py'
      - 'scripts/archicad_scene_run.py'
      - 'scripts/test_archicad_mailbox_wall_host.py'
      - 'scripts/archicad_guarded_wall_probe.py'
      - 'scripts/archicad_mailbox_watch.py'
      - 'scripts/archicad_runtime_version_probe.py'
      - 'scripts/start_archicad_mailbox_watch.ps1'
      - 'scripts/install_mailbox_watch_autostart.ps1'
      - 'tests/test_archicad_batch_contracts.py'
      - 'tests/test_archicad_bim_graph.py'
      - 'tests/test_archicad_mailbox_graph_adapter.py'
      - 'tests/test_archicad_wall_host_integration.py'
      - 'tests/test_archicad_scene_run.py'
      - 'tests/test_archicad_mailbox_watch.py'
      - 'tests/test_archicad_runtime_version_probe.py'
      - 'tapir-1.5.8.json'
      - 'examples/archicad_bim_graph.offline.sample.json'
      - '.github/workflows/archicad-contracts.yml'
  pull_request:
    paths:
      - 'scripts/archicad_batch_contracts.py'
      - 'scripts/archicad_bim_graph.py'
      - 'scripts/archicad_mailbox_graph_adapter.py'
      - 'scripts/archicad_mailbox_wall_host.py'
      - 'scripts/archicad_scene_v1.py'
      - 'scripts/archicad_scene_run.py'
      - 'scripts/test_archicad_mailbox_wall_host.py'
      - 'scripts/archicad_guarded_wall_probe.py'
      - 'scripts/archicad_mailbox_watch.py'
      - 'scripts/archicad_runtime_version_probe.py'
      - 'scripts/start_archicad_mailbox_watch.ps1'
      - 'scripts/install_mailbox_watch_autostart.ps1'
      - 'tests/test_archicad_bim_graph.py'
      - 'tests/test_archicad_mailbox_graph_adapter.py'
      - 'tests/test_archicad_wall_host_integration.py'
      - 'tests/test_archicad_scene_run.py'
      - 'tests/test_archicad_mailbox_watch.py'
      - 'tests/test_archicad_runtime_version_probe.py'
      - 'tests/test_archicad_batch_contracts.py'
      - 'tapir-1.5.8.json'
      - 'examples/archicad_bim_graph.offline.sample.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'jsonschema>=4,<5'
      - run: python -m unittest discover -s tests -p 'test_archicad_*.py' -v
      - run: python scripts/archicad_batch_contracts.py --runtime-version 1.5.8
      - run: python scripts/archicad_bim_graph.py examples/archicad_bim_graph.offline.sample.json --runtime-version 1.5.8
      - name: Static check Windows launcher syntax
        shell: pwsh
        run: |
          $paths = @("scripts/start_archicad_mailbox_watch.ps1", "scripts/install_mailbox_watch_autostart.ps1")
          foreach ($path in $paths) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error $_.Message }
              throw "PowerShell syntax error: $path"
            }
            Write-Host "PARSE_OK: $path"
          }
