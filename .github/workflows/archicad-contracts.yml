permissions:
  contents: read

jobs:
  offline-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'jsonschema>=4,<5'
      - run: python -m pip install -r scripts/requirements-connected.txt
      - run: python -m pip install -r scripts/requirements-knowledge.txt
      - uses: actions/checkout@v4
        with:
          ref: research/apa-verified-results-hub-20261010
          path: knowledge-corpus
      - name: Preserve upstream graph tests on the full canonical corpus
        run: python -m unittest discover -s knowledge-corpus/tools/apa_knowledge_graph/tests -v
      - name: APA core and actual MCP stdio integration
        run: python scripts/apa_knowledge_integration_smoke.py --corpus knowledge-corpus --output knowledge-smoke-result
      - run: python -m unittest discover -s tests -p 'test_archicad_*.py' -v
      - run: python scripts/archicad_batch_contracts.py --runtime-version 1.5.8
      - run: python scripts/archicad_bim_graph.py examples/archicad_bim_graph.offline.sample.json --runtime-version 1.5.8
      - name: Static check Windows launcher syntax
        shell: pwsh
        run: |
          $paths = @("scripts/start_archicad_mailbox_watch.ps1", "scripts/install_mailbox_watch_autostart.ps1", "scripts/run_apa_test_house_01.ps1")
          foreach ($path in $paths) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error $_.Message }
              throw "PowerShell syntax error: $path"
            }
            Write-Host "PARSE_OK: $path"
          }
