name: Offline Archicad schema contracts

on:
  push:
    branches:
      - 'chatgpt/schema-driven-*'
    paths:
      - 'scripts/archicad_batch_contracts.py'
      - 'scripts/archicad_bim_graph.py'
      - 'scripts/archicad_mailbox_graph_adapter.py'
      - 'scripts/archicad_mailbox_watch.py'
      - 'tests/test_archicad_batch_contracts.py'
      - 'tests/test_archicad_bim_graph.py'
      - 'tests/test_archicad_mailbox_graph_adapter.py'
      - 'tests/test_archicad_mailbox_watch.py'
      - 'tapir-1.5.8.json'
      - 'examples/archicad_bim_graph.offline.sample.json'
      - '.github/workflows/archicad-contracts.yml'
  pull_request:
    paths:
      - 'scripts/archicad_batch_contracts.py'
      - 'scripts/archicad_bim_graph.py'
      - 'scripts/archicad_mailbox_graph_adapter.py'
      - 'scripts/archicad_mailbox_watch.py'
      - 'tests/test_archicad_bim_graph.py'
      - 'tests/test_archicad_mailbox_graph_adapter.py'
      - 'tests/test_archicad_mailbox_watch.py'
      - 'tests/test_archicad_batch_contracts.py'
      - 'tapir-1.5.8.json'
      - 'examples/archicad_bim_graph.offline.sample.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'jsonschema>=4,<5'
      - run: python -m unittest discover -s tests -p 'test_archicad_*.py' -v
      - run: python scripts/archicad_batch_contracts.py --runtime-version 1.5.8
      - run: python scripts/archicad_bim_graph.py examples/archicad_bim_graph.offline.sample.json --runtime-version 1.5.8
