name: Bureau Chat Activation Gateway - focused verification

on:
  pull_request:
    paths:
      - 'scripts/bureau_chat_activation_gateway.py'
      - 'scripts/bureau_unified_service.py'
      - 'tests/test_bureau_chat_activation_gateway.py'
      - 'tests/test_bureau_unified_service.py'
      - '.github/workflows/bureau-chat-activation-gateway.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safety-and-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile dispatcher
        run: python -m py_compile scripts/bureau_chat_activation_gateway.py scripts/bureau_unified_service.py tests/test_bureau_chat_activation_gateway.py tests/test_bureau_unified_service.py
      - name: Test queue and launch guards
        run: python -m unittest discover -s tests -p 'test_bureau_chat_activation_gateway.py' -v
      - name: Test unified multi-chat runtime and stage guards
        run: python -m unittest discover -s tests -p 'test_bureau_unified_service.py' -v

