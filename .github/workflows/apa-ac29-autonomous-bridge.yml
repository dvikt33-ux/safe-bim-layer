name: APA AC29 Autonomous Job Bridge

on:
  pull_request:
    paths:
      - "scripts/apa_ac29_autonomous_job_bridge.py"
      - "scripts/install_apa_ac29_autonomous_job_bridge.py"
      - "scripts/apa_ac29_pinned_registry_upgrade.py"
      - "tests/test_apa_ac29_autonomous_bridge.py"
      - ".github/workflows/apa-ac29-autonomous-bridge.yml"
  workflow_dispatch:

jobs:
  focused-bridge-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile only new bridge/installer
        run: python -m py_compile scripts/apa_ac29_autonomous_job_bridge.py scripts/install_apa_ac29_autonomous_job_bridge.py scripts/apa_ac29_pinned_registry_upgrade.py tests/test_apa_ac29_autonomous_bridge.py
      - name: Check focused ingress, local grants and no-replay cases
        run: python -m unittest discover -s tests -p "test_apa_ac29_autonomous_bridge.py" -v
