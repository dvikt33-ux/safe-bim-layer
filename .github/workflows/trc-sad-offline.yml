name: TRC-SAD isolated geometry and APA graph preview

on:
  push:
    branches:
      - 'feature/trc-sad-native-plan-preview-*'
    paths:
      - 'data/trc_sad_concept_v1.json'
      - 'scripts/trc_sad_plan.py'
      - 'scripts/trc_sad_port_probe.py'
      - 'scripts/trc_sad_draw_2d.py'
      - 'scripts/trc_sad_grid_2d.py'
      - 'scripts/trc_sad_cleanup.py'
      - 'data/trc_sad_structural_grid_v2.json'
      - 'tests/test_trc_sad_plan.py'
      - 'tests/test_trc_sad_port_probe.py'
      - 'tests/test_trc_sad_draw_2d.py'
      - 'tests/test_trc_sad_grid_2d.py'
      - '.github/workflows/trc-sad-offline.yml'
  pull_request:
    paths:
      - 'data/trc_sad_concept_v1.json'
      - 'scripts/trc_sad_plan.py'
      - 'scripts/trc_sad_port_probe.py'
      - 'scripts/trc_sad_draw_2d.py'
      - 'scripts/trc_sad_grid_2d.py'
      - 'tests/test_trc_sad_plan.py'
      - 'tests/test_trc_sad_port_probe.py'
      - 'tests/test_trc_sad_draw_2d.py'
      - 'tests/test_trc_sad_grid_2d.py'
      - '.github/workflows/trc-sad-offline.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'jsonschema>=4,<5'
      - run: python -m unittest discover -s tests -p 'test_trc_sad_plan.py' -v
      - run: python -m unittest discover -s tests -p 'test_trc_sad_port_probe.py' -v
      - run: python -m unittest discover -s tests -p 'test_trc_sad_draw_2d.py' -v
      - run: python scripts/trc_sad_draw_2d.py --floor all
      - run: python -m unittest discover -s tests -p 'test_trc_sad_grid_2d.py' -v
      - run: python scripts/trc_sad_grid_2d.py --floor all
      - run: python -m py_compile scripts/trc_sad_cleanup.py
      - run: python -c "import json; x=json.load(open('data/trc_sad_structural_grid_v2.json',encoding='utf8')); assert round(sum(x['x']['bays']),6)==184.8 and round(sum(x['y']['bays']),6)==142.8 and min(x['x']['bays']+x['y']['bays'])>=18 and max(x['x']['bays']+x['y']['bays'])<=24"
      - run: python scripts/trc_sad_plan.py --output trc-preview.json
      - run: python -c "import json; d=json.load(open('trc-preview.json',encoding='utf8')); assert d['nativeWrites']==0 and d['plnChanged']==False and d['aboveGroundSlabAreaSquareMeters']==72712.08"
