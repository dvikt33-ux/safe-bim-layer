name: MOAG R11-R22 real MiniZinc and CP-SAT
on:
  pull_request:
    paths:
      - 'tools/moag_topology/**'
      - 'tests/test_moag_solver_r11.py'
      - 'tests/test_moag_spatial_r12.py'
      - 'tests/test_moag_volumes_r13.py'
      - 'tests/test_moag_routes_r14.py'
      - 'tests/test_moag_integrated_r15.py'
      - 'tests/test_moag_evidence_r16.py'
      - 'tests/test_moag_lower_r17.py'
      - 'tests/test_moag_identity_r18.py'
      - 'tests/test_moag_cargo_r19.py'
      - 'tests/test_moag_sealed_r20.py'
      - 'tests/test_moag_crosswalk_r21.py'
      - 'tests/test_moag_connectivity_r22.py'
      - 'docs/research/apa-results/moag/**'
      - '.github/workflows/moag-solvers-r11.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-solvers:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned OR-Tools dependencies
        run: python -m pip install -r tools/moag_topology/requirements-r11.txt
      - name: Download hash-verified official portable MiniZinc (retry transient network faults)
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if python tools/moag_topology/bootstrap_r11.py; then
              exit 0
            fi
            rm -f .runtime/minizinc.zip .runtime/minizinc.tar.gz
            if [ "$attempt" -eq 3 ]; then
              echo "Official SHA256-verified MiniZinc unavailable after three attempts" >&2
              exit 1
            fi
            sleep $((attempt * 10))
          done
      - name: Run source-qualified real lower-block SAT UNSAT and alternatives
        run: python tools/moag_topology/solver_r11.py --out moag-r11-run
      - name: R12 source-backed raised spaces, Lower
        run: python tools/moag_topology/spatial_constraints_r12.py --scope 1 --out moag-r12-lower
      - name: R12 local residential gallery, Second
        run: python tools/moag_topology/spatial_constraints_r12.py --scope 2 --out moag-r12-second
      - name: R12 circular-lounge upper gallery, Third
        run: python tools/moag_topology/spatial_constraints_r12.py --scope 3 --out moag-r12-third
      - name: R13 true 3D scenario non-overlap and parent enclosure via MiniZinc and OR-Tools
        run: python tools/moag_topology/scenario_volumes_r13.py --out moag-r13-run
      - name: R14 actual full-route 52-path MiniZinc and OR-Tools ordinal feasibility
        run: python tools/moag_topology/route_constraints_r14.py --out moag-r14-run
      - name: R15 joint volume visit and local-height feasibility, conflict replay and domain alternatives
        run: python tools/moag_topology/integrated_spatial_r15.py --out moag-r15-run
      - name: R16 audited 353 unknown stages and B1-065 fork inside real R15 solver
        run: python tools/moag_topology/evidence_triage_r16.py --out moag-r16-run
      - name: R17 sourced Lower-base versus hangar sector and existing doors SAT UNSAT
        run: python tools/moag_topology/lower_evidence_r17.py --out moag-r17-run
      - name: R18 book-backed same/different identities and multiple joint solver countermodels
        run: python tools/moag_topology/identity_alternatives_r18.py --out moag-r18-run
      - name: R19 historical cargo succession and residual Lower shuttles MiniZinc OR-Tools
        run: python tools/moag_topology/cargo_history_r19.py --out moag-r19-run
      - name: R20 sealed fork sleeping-vs-round halls and book passage type CP-SAT
        run: python tools/moag_topology/sealed_paths_r20.py --out moag-r20-run
      - name: R21 source-qualified 30 overloaded route aliases and cross-episode MiniZinc countermodels
        run: python tools/moag_topology/contextual_crosswalk_r21.py --out moag-r21-run
      - name: R22 physical identity quotient and source-qualified connectivity
        run: python tools/moag_topology/physical_connectivity_r22.py --out moag-r22-run
      - name: Full MOAG regression including R11-R22 with actual OR-Tools available
        run: python -m unittest discover -s tests -p "test_moag_*.py" -v
      - name: Require immutable pre-existing research sources
        run: git diff --exit-code -- docs/research/apa-results/moag/v1 docs/research/apa-results/moag/v2 docs/research/apa-results/moag/synthesis
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: moag-r11-r22-${{ matrix.os }}
          path: |
            moag-r11-run/
            moag-r12-lower/
            moag-r12-second/
            moag-r12-third/
            moag-r13-run/
            moag-r14-run/
            moag-r15-run/
            moag-r16-run/
            moag-r17-run/
            moag-r18-run/
            moag-r19-run/
            moag-r20-run/
            moag-r21-run/
            moag-r22-run/
          if-no-files-found: error
          retention-days: 30
