name: APA independent dynamic provider offline QA

on:
  push:
    branches:
      - 'audit/apa-dynamic-provider-regression-*'
    paths:
      - 'tests/test_archicad_independent_provider_audit.py'
      - '.github/workflows/apa-independent-provider-audit.yml'
  pull_request:
    paths:
      - 'tests/test_archicad_independent_provider_audit.py'
      - '.github/workflows/apa-independent-provider-audit.yml'

permissions:
  contents: read

jobs:
  targeted-provider-contracts:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing APA offline dependencies
        run: |
          python -m pip install 'jsonschema>=4,<5'
          python -m pip install -r scripts/requirements-connected.txt
          python -m pip install -r scripts/requirements-knowledge.txt
      - name: Independent targeted checks (known defects are explicit XFAIL)
        run: python -m unittest discover -s tests -p 'test_archicad_independent_provider_audit.py' -v
