name: Validate Archicad template specs

on:
  push:
    branches:
      - feature/working-archicad-mvp
    paths:
      - 'scripts/archicad_template_builder.py'
      - 'scripts/promote_archicad_template_gate.py'
      - 'scripts/promote_archicad_template_gate.py'
      - 'scripts/requirements-template.txt'
      - 'docs/archicad-template/**'
      - '.github/workflows/archicad-template-validate.yml'
  pull_request:
    paths:
      - 'scripts/archicad_template_builder.py'
      - 'scripts/requirements-template.txt'
      - 'docs/archicad-template/**'
      - '.github/workflows/archicad-template-validate.yml'

jobs:
  validate-template:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install template builder dependency
        run: python -m pip install -r scripts/requirements-template.txt

      - name: Compile template builder
        run: python -m py_compile scripts/archicad_template_builder.py

      - name: Compile live gate promotion helper
        run: python -m py_compile scripts/promote_archicad_template_gate.py

      - name: Parse all template YAML files
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          files = sorted(Path('docs/archicad-template').glob('*.yaml'))
          if not files:
              raise SystemExit('No YAML template specs found')
          for path in files:
              with path.open('r', encoding='utf-8') as fh:
                  data = yaml.safe_load(fh)
              if data is None:
                  raise SystemExit(f'Empty YAML: {path}')
              print(f'OK {path}')
          print(f'Parsed {len(files)} YAML files')
          PY

      - name: Run offline template validation
        run: |
          python scripts/archicad_template_builder.py validate --out template-validation.json
          cat template-validation.json

      - name: Upload validation result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: archicad-template-validation
          path: template-validation.json
          if-no-files-found: ignore
