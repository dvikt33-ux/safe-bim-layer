name: APA IFC geometry B3 real vendors
on:
  pull_request:
    paths:
      - scripts/apa_ifc_geometry_b3.py
      - scripts/apa_ifc_geometry_factory_b3.py
      - scripts/install_apa_ifc_geometry_b3.py
      - tests/test_apa_ifc_geometry_b3.py
      - tests/apa_ifc_geometry_installed_smoke_b3.py
      - .github/workflows/apa-ifc-geometry-b3.yml
permissions:
  contents: read
jobs:
  real-geometry:
    runs-on: windows-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r scripts/requirements-ifc-artifacts-b2-lock.txt
      - run: python -m py_compile scripts/apa_ifc_geometry_factory_b3.py scripts/install_apa_ifc_geometry_b3.py tests/apa_ifc_geometry_installed_smoke_b3.py
      - run: python -m unittest discover -s tests -p "test_apa_ifc_*.py" -v
      - run: python -m unittest discover -s tests -p "test_apa_dxf_geometry_c1.py" -v
      - run: python -m unittest discover -s tests -p "test_apa_high_density*.py" -v
