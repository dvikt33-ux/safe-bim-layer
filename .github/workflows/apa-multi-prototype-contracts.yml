name: APA Multi Prototype Contracts
on:
  pull_request:
    paths:
      - 'scripts/apa_ac29_multi_prototype_native_copy.py'
      - 'scripts/apa_ac29_autonomous_job_bridge.py'
      - 'tests/test_apa_ac29_multi_prototype_native_copy.py'
      - '.github/workflows/apa-multi-prototype-contracts.yml'
jobs:
  new-contracts-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile scripts/apa_ac29_multi_prototype_native_copy.py scripts/apa_ac29_autonomous_job_bridge.py
      - run: python -m unittest discover -s tests -p 'test_apa_ac29_multi_prototype_native_copy.py' -v
