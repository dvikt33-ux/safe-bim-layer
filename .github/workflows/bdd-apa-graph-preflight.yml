name: BDD existing APA BIM Graph preflight
on:
  pull_request:
    paths:
      - "examples/accelerator/bdd-house-20261016-readonly-native-task.json"
      - ".github/workflows/bdd-apa-graph-preflight.yml"
  workflow_dispatch:

jobs:
  existing-graph-compiler:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile with existing BIM Graph only; no native I/O
        run: |
          python -m pip install jsonschema
          python - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,'scripts')
          import archicad_bim_graph as graph
          task=json.loads(Path('examples/accelerator/bdd-house-20261016-readonly-native-task.json').read_text(encoding='utf-8'))
          catalog=json.loads(Path('schemas/tapir-live-1.5.10/tapir-scene-live.json').read_text(encoding='utf-8'))
          assert task['schemaVersion']=='apa-native-task/1'
          assert len(task['graph']['operations'])==13
          cmds=[item['command'] for item in task['graph']['operations']]
          assert set(cmds)=={'GetProjectInfo','GetStories','GetAllElements','GetDetailsOfElements','Get3DBoundingBoxes'}
          assert sum(len(step['params']['elements']) for step in task['graph']['operations'] if step['command']=='GetDetailsOfElements')==125
          result=graph.compile_graph(catalog,task['graph'],runtime_version='1.5.10')
          print(json.dumps(result,indent=2,ensure_ascii=True)[:6000])
          assert result['status']=='PLAN_VALIDATED_OFFLINE'
          print('EXISTING_APA_BIM_GRAPH_ACCEPTS_BDD_READ_PLAN')
          PY
