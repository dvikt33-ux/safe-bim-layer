name: APA MOAG evidence topology offline
on:
  pull_request:
    paths:
      - 'docs/research/apa-results/moag/v1/**'
      - 'tools/moag_topology/**'
      - 'tests/test_moag_*.py'
      - '.github/workflows/apa-moag-topology-offline.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate all node and edge evidence
        run: python tools/moag_topology/validate.py docs/research/apa-results/moag/v1/evidence_graph.json --mode verify
      - name: Validate full 412-page ledger and visual evidence boundaries
        run: python tools/moag_topology/page_audit.py
      - name: Run fail-closed topology tests
        run: python -m unittest discover -s tests -p test_moag_*.py -v
      - name: Assemble MOAG R06 evidence graph (no native writes)
        run: |
          python tools/moag_topology/assemble_evidence_graph_r06.py --between M-L2-EMMA-SUITE-001 M-L2-EMMA-KITCHEN-001 --out moag-r06-result.json
          python -c "import json; r=json.load(open('moag-r06-result.json')); assert r['counts']['physical_indices']==197 and r['gates']['archicad_write'] is False and r['counts']['route_ledgers']>0 and r['requested_evidence_trace']['edge_chain']; print('R06',r['status'],r['counts'])"
      - name: Export physical graph, access graph and separate area-volume projections
        run: |
          python tools/moag_topology/inspect_graph_structure_r06.py --between M-L1-FH-001-CTRL M-L1-FH-002-CTRL --out moag-r06-structural-projections.json
          python -c "import json; r=json.load(open('moag-r06-structural-projections.json')); assert r['physical_index_count']==197 and r['area_and_volume_accounting']['area_bearing']==157 and r['gates']['geometry_approved'] is False and r['direct_access_graph']['component_count']>1 and r['requested_explicit_access_chain']['edge_chain']; print('R06 structural',r['direct_access_graph']['component_count'],r['evidence_relation_classes'])"
      - name: Audit objective MOAG R06 readiness and hard BIM gates
        run: |
          python tools/moag_topology/audit_readiness_r06.py --out moag-r06-readiness.json
          python -c "import json; r=json.load(open('moag-r06-readiness.json')); assert r['source_reading']['total_corpus_pages']==412 and r['area_volume']['book_metric_footprint_profiles']==0 and r['gates']['BIM_release_ready'] is False; print('READINESS',r['source_reading'],r['graph_structure'],r['levels_and_geometry'])"
      - name: Export unresolved architecture and route-gap research backlog
        run: |
          python tools/moag_topology/research_frontiers_r06.py --out moag-r06-research-frontiers.json
          python -c "import json; r=json.load(open('moag-r06-research-frontiers.json')); assert r['fixed_infrastructure_isolation_count']==12 and r['total_route_gaps']==18 and r['geometry_approved'] is False; print('SOURCE_TRIAGE',r['fixed_infrastructure_isolation_count'],r['total_route_gaps'])"
      - name: Build unified source-aware MOAG R07 relation inventory
        run: |
          python tools/moag_topology/unified_evidence_graph_r07.py --out moag-r07-unified-evidence.json
          python -c "import json; x=json.load(open('moag-r07-unified-evidence.json')); i=x['inventory']; assert i['all_vertices']==575 and i['physical_or_conceptual_indices']==197 and i['direct_access_edges']==25 and i['narrative_gaps_not_joined']==18 and not x['gates']['bim_authorized'] and not x['gates']['one_qualitative_spatial_component']; print('UNIFIED_R07',i['all_vertices'],i['all_typed_relations'],i['qualitative_components_with_physical_indices'])"
      - name: Preserve unknown passages and symmetry alternatives in R08 overlay
        run: |
          python tools/moag_topology/hypothesis_overlay_r08.py --out moag-r08-hypotheses.json
          python -c "import json; r=json.load(open('moag-r08-hypotheses.json')); c=r['counts']; assert c['proven_nodes_unchanged']==575 and c['proven_edges_unchanged']==761 and c['unknown_route_intervals_kept']==18 and c['unlocated_fixed_elements_kept']==12 and c['unselected_layout_options']==16 and c['hypothetical_edges']==64 and r['merged_visualization_relation_count']==825 and c['proven_components_unchanged']==39 and r['gates']['hypotheses_can_change_proven_connectivity'] is False and r['gates']['symmetry_assumed_as_fact'] is False and r['gates']['Archicad_writes'] is False; print('R08',c)"
      - name: Verify opt-in unproven symmetry and route-layout preview
        run: |
          python tools/moag_topology/hypothesis_overlay_r08.py --preview R08-H001 R08-H003 --out moag-r08-what-if.json
          python -c "import json; r=json.load(open('moag-r08-what-if.json')); p=r['requested_hypothetical_preview']; assert p['verified_physical_component_count_still']==39 and p['conditional_physical_component_count']<=39 and p['evidence_graph_unchanged'] and not p['geometry_or_direct_access_approved']; print('WHAT_IF_ONLY',p['conditional_physical_component_count'])"
      - name: Preserve R08 unlocated rooms, route holes and nonbinding symmetry scenarios
        run: |
          python tools/moag_topology/hypothetical_structure_r08.py --out moag-r08-hypothetical-overlay.json
          python -c "import json; r=json.load(open('moag-r08-hypothetical-overlay.json')); i=r['inventory']; assert i['unlocated_fixed_object_groups']==12 and i['still_unknown_route_gaps']==18 and i['ordered_route_transitions_with_unlocated_path_geometry']==306 and i['optional_compositional_pattern_scenarios']==3 and i['total_nodes_including_nonphysical_placeholders']==593 and i['total_relations_including_unapproved_scenarios']==821 and i['approved_explicit_access_edges']==25 and i['approved_qualitative_physical_components']==39 and r['gates']['hypothesis_edges_are_nonconnecting'] and not r['gates']['archicad_write']; print('UNCERTAINTY_R08',i)"
      - name: Reconcile overlapping R08 hypothesis registers without conflating variants
        run: |
          python tools/moag_topology/reconcile_uncertainty_r09.py --out moag-r09-reconciled-uncertainty.json
          python -c "import json; x=json.load(open('moag-r09-reconciled-uncertainty.json')); q=x['quantities']; assert q['total_vertices']==593 and q['total_typed_edges']==845 and q['cross_referenced_same_endpoint_candidates']==4 and q['unknown_route_gaps_reconciled']==18 and q['observed_transitions_still_without_direct_geometry']==306 and not x['gates']['archicad_write'] and not x['gates']['hypothesis_may_merge_evidence_components']; print('R09',q)"
      - name: Produce source-page bridge review frontier R10 without spatial writes
        run: |
          python tools/moag_topology/review_frontiers_r10.py --out moag-r10-review-frontiers.json
          python -c "import json; r=json.load(open('moag-r10-review-frontiers.json')); q=r['quantities']; assert q['fixed_isolates']==12 and q['candidate_options']==24 and q['narrative_gaps']==18 and q['witnessed_intervals']==306 and q['global_identity_questions']==5 and not any(r['gates'].values()); print('FRONTIERS_R10',q)"
      - name: Archive R06 evidence graphs without promoting them to geometry
        uses: actions/upload-artifact@v4
        with:
          name: moag-r06-evidence-python-${{ matrix.python-version }}
          path: |
            moag-r06-result.json
            moag-r06-structural-projections.json
            moag-r06-readiness.json
            moag-r06-research-frontiers.json
            moag-r07-unified-evidence.json
            moag-r09-reconciled-uncertainty.json
            moag-r10-review-frontiers.json
            moag-r08-hypothetical-overlay.json
            moag-r08-hypotheses.json
            moag-r08-what-if.json
          if-no-files-found: error
          retention-days: 30
      - name: Validate site-page coverage and hypotheses
        run: python tools/moag_topology/page_audit.py
      - name: Validate ordered multi-level character routes
        run: python tools/moag_topology/routes_audit.py
      - name: Validate snapshot cannot execute native writes
        run: |
          python tools/moag_topology/validate.py docs/research/apa-results/moag/v1/evidence_graph.json --mode snapshot --out moag-snapshot.json
          python -c "import json; o=json.load(open('moag-snapshot.json')); assert o['gates']['apa_native_execute'] is False and o['gates']['scene_writer_write'] is False"
