name: APA MOAG evidence topology offline
on:
  pull_request:
    paths:
      - 'docs/research/apa-results/moag/v1/**'
      - 'tools/moag_topology/**'
      - 'tests/test_moag_*.py'
      - '.github/workflows/apa-moag-topology-offline.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate all node and edge evidence
        run: python tools/moag_topology/validate.py docs/research/apa-results/moag/v1/evidence_graph.json --mode verify
      - name: Validate full 412-page ledger and visual evidence boundaries
        run: python tools/moag_topology/page_audit.py
      - name: Run fail-closed topology tests
        run: python -m unittest discover -s tests -p test_moag_*.py -v
      - name: Validate snapshot cannot execute native writes
        run: |
          python tools/moag_topology/validate.py docs/research/apa-results/moag/v1/evidence_graph.json --mode snapshot --out moag-snapshot.json
          python -c "import json; o=json.load(open('moag-snapshot.json')); assert o['gates']['apa_native_execute'] is False and o['gates']['scene_writer_write'] is False"
