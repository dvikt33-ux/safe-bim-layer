name: Index detail dimension queue
on:
  push:
    branches: [feature/working-archicad-mvp]
    paths:
      - details/tools/index_dimension_queue.py
      - .github/workflows/index-detail-queue.yml
permissions:
  contents: write
jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/working-archicad-mvp
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python details/tools/index_dimension_queue.py
      - name: Commit queue index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add details/index/dimension_queue_by_source.json
          git diff --cached --quiet && exit 0
          git commit -m "Index active detail dimension queue by source"
          git push origin HEAD:feature/working-archicad-mvp