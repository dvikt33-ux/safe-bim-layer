name: BDD first existing-host native Window via APA
on:
  pull_request:
    paths:
      - "scripts/apa_bdd_native_first_window_scene_writer.py"
      - "scripts/archicad_scene_run.py"
      - "tests/test_apa_bdd_first_window_scene_writer.py"
      - "tests/test_apa_bdd_optin_3d_writer_guard.py"
      - "docs/research/apa-results/bdd-house/APA_KR12_BLOCK_1P8_FIRST_WINDOW_INTENT.json"
      - ".github/workflows/apa-bdd-first-window.yml"
  workflow_dispatch:
jobs:
  source-bound-apa-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install existing APA requirements
        run: python -m pip install jsonschema networkx shapely
      - name: Compile and verify source-bound APA Window task
        run: |
          python -m py_compile scripts/apa_bdd_native_first_window_scene_writer.py scripts/archicad_scene_run.py
          python -m unittest discover -s tests -p test_apa_bdd_first_window_scene_writer.py -v
          python -m unittest discover -s tests -p test_apa_bdd_optin_3d_writer_guard.py -v
