name: MOAG VIS-01 graph-derived scenario
on:
  pull_request:
    paths:
      - 'tools/moag_vis/**'
      - 'tests/test_moag_vis01.py'
      - 'outputs/moag-vis-01/**'
      - '.github/workflows/moag-vis-01.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scenario:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned VIS-01 and solver dependencies
        run: python -m pip install -r tools/moag_vis/requirements-vis01.txt
      - name: Install SHA256-verified MiniZinc
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if python tools/moag_topology/bootstrap_r11.py; then exit 0; fi
            rm -f .runtime/minizinc.zip .runtime/minizinc.tar.gz
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 10))
          done
      - name: Build, solve and render one scenario
        run: python tools/moag_vis/generate_vis01.py --out outputs/moag-vis-01/generated
      - name: Check source coverage, geometry, files and solver outcomes
        run: python -m unittest discover -s tests -p test_moag_vis01.py -v
      - name: Check unchanged source ledgers
        run: git diff --exit-code -- docs/research/apa-results/moag/v1 docs/research/apa-results/moag/v2 docs/research/apa-results/moag/synthesis
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: moag-vis01-${{ matrix.os }}
          path: outputs/moag-vis-01/generated/
          if-no-files-found: error
          retention-days: 30
