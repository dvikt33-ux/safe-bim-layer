name: APA PDFVectors Lossless - Windows Pinned Vendor
on:
  push:
    branches:
      - feature/apa-external-pdf-lossless-20261018
    paths:
      - scripts/apa_external_readonly.py
      - scripts/upgrade_apa_external_pdfvectors_lossless.py
      - tests/test_apa_external_pdfvectors_lossless.py
      - .github/workflows/apa-external-pdfvectors-lossless.yml
  pull_request:
    branches:
      - feature/apa-readonly-tools-isolated-20261017
  workflow_dispatch:
jobs:
  pdfvectors-source-and-real-vendor:
    runs-on: windows-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile PDF-only adapter and upgrade
        shell: pwsh
        run: |
          python -m py_compile scripts/apa_external_readonly.py scripts/upgrade_apa_external_pdfvectors_lossless.py tests/test_apa_external_pdfvectors_lossless.py
          if ($LASTEXITCODE -ne 0) { throw "compile failed" }
      - name: Install exact PDF vendor only
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: pdfplumber==0.11.10
          if ($LASTEXITCODE -ne 0) { throw "pdf vendor install failed" }
      - name: Execute actual pdfplumber + full-coverage regressions
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p test_apa_external_pdfvectors_lossless.py -v
          if ($LASTEXITCODE -ne 0) { throw "lossless PDF regression failed" }
