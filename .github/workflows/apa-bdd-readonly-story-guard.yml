name: APA BDD Readonly 3D Story Guard
on:
  pull_request:
    paths:
      - "scripts/archicad_scene_run.py"
      - "scripts/archicad_dynamic_commands.py"
      - "scripts/apa_bdd_existing_router_readback.py"
      - "tests/test_apa_bdd_readonly_story_guard.py"
      - ".github/workflows/apa-bdd-readonly-story-guard.yml"
  workflow_dispatch:
jobs:
  existing-apa-read-only-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install existing APA test dependencies
        run: python -m pip install jsonschema networkx shapely
      - name: Compile existing modified modules
        run: python -m py_compile scripts/archicad_scene_run.py scripts/archicad_dynamic_commands.py scripts/apa_bdd_existing_router_readback.py
      - name: Focused view/story regression plus previous BDD binding
        run: |
          python -m unittest discover -s tests -p test_apa_bdd_readonly_story_guard.py -v
          python -m unittest discover -s tests -p test_apa_bdd_existing_router_readback.py -v
