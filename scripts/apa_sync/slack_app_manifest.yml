_metadata:
  major_version: 1

display_information:
  name: APA Coordinator
  description: Event ledger for Archicad Project Accelerator agents

features:
  bot_user:
    display_name: APA Coordinator
    always_online: false

oauth_config:
  scopes:
    bot:
      - channels:history
      - chat:write

settings:
  event_subscriptions:
    bot_events:
      - message.channels
  org_deploy_enabled: false
  socket_mode_enabled: true
  is_hosted: false
  token_rotation_enabled: false
