selection_semantics:
  - "Preset является коротким путем; пользователь может выбрать произвольное подмножество implemented_blocks."
  - "Dependency resolver добавляет только requires, а не все предыдущие/чужие разделы автоматически."
  - "general_plan=schematic выбирает только IZHS.SITE.CORE; отсутствие site-specific PZZ/GPZU параметров является missing project input, а не разрешением подставить средние значения."
  - "architecture=shell выбирает только core shell; architecture=details добавляет architectural detail/roof blocks."
  - "structures=calculation, geotechnics=calculation, evacuation=detailed и thermal_protection=calculation являются независимыми модулями и не включаются автоматически только из-за глубины architecture."
  - "geotechnics=calculation может выдать проверки/стратегии фундамента, но без достаточных инженерных изысканий не имеет права выдавать authoritative foundation sizing."
  - "water_supply=schematic выбирает IZHS.VK.SCHEMATIC; water_supply=coordinated добавляет IZHS.VK.CALC."
  - "heating/ventilation/air_conditioning=schematic выбирает единый IZHS.HVAC.SCHEMATIC с прямыми ИЖС-правилами СП55; расчет мощности и сечений остается отдельной будущей глубиной."
  - "gas_supply=schematic выбирает только IZHS.GAS.SCHEMATIC при фактически выбранной внутренней системе природного газа; блок не включается в общий MEP preset автоматически."
  - "Нормативное/расчетное ядро инженерного раздела отделяется от геометрического блока, когда это уменьшает повторный аудит и загрузку контекста."
  - "FAST PACK включается только если конкретный implemented block или его core сообщает незакрытую зависимость для текущей операции."
  - "Planned block нельзя подменять похожим implemented block другого раздела или типа здания."
