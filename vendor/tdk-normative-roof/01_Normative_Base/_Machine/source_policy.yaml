policy_version: 2
principle: "В рабочую нормативную базу попадают только проверяемые сведения из допустимых источников. Сомнительный источник, карточка документа или один заголовок не могут подтверждать норму."

source_tiers:
  A1_primary_legal_system:
    trusted: true
    hosts:
      - "consultant.ru"
      - "demo.consultant.ru"
      - "garant.ru"
      - "demo.garant.ru"
      - "base.garant.ru"
    rule: "КонсультантПлюс/ГАРАНТ являются доверенными площадками, но доверие к площадке не означает автоматическое подтверждение содержания конкретной нормы."

  A2_one_hop_from_A1:
    trusted: true
    rule: "Разрешена проверка ровно одной внешней страницы, на которую ведёт прямая ссылка с A1. Переходы с этой внешней страницы дальше запрещены как источник доверия."
    max_external_hops: 1
    downstream_links_trusted: false
    requirements:
      - "сохранить исходный A1 URL"
      - "сохранить точный внешний target URL"
      - "зафиксировать, что target получен прямым переходом с A1"
      - "не наследовать доверие ссылкам, размещённым на target"

  B_candidate_official_primary:
    trusted: false
    promotable: true
    rule: "Официальные сайты органов власти/регуляторов могут использоваться для поиска и сверки, но до включения нормы в ядро требуется подтверждение идентичности документа и применимости через A1 либо явное решение аудита."

  C_secondary_reference:
    trusted: false
    rule: "Справочные, коммерческие, образовательные, агрегаторные и иные вторичные сайты — только навигация/подсказка. Норму не подтверждают."

  D_unknown:
    trusted: false
    rule: "Неизвестные/сомнительные источники не используются для рабочей нормативной базы."

content_access_levels:
  title_only:
    can_confirm_rule: false
    description: "Доступно только название/результат поиска/карточка без нормативного текста."
  metadata_only:
    can_confirm_rule: false
    description: "Подтверждены реквизиты, статус или редакция, но не прочитан текст конкретной нормы."
  partial_text:
    can_confirm_rule: true
    description: "Открыт нормативный текст и прочитан конкретный структурный элемент, на который ссылается правило. Подтверждается только этот элемент, не весь документ."
  full_text:
    can_confirm_rule: true
    description: "Открыт полный/достаточно полный нормативный текст документа. Каждое правило всё равно требует собственного locator."

promotion_rules:
  to_confirmed:
    require:
      - "source_tier in [A1_primary_legal_system, A2_one_hop_from_A1]"
      - "content_access in [partial_text, full_text]"
      - "text_opened == true"
      - "точный документ идентифицирован"
      - "структурный локатор нормы указан"
      - "содержимое locator фактически прочитано"
      - "редакция/изменение идентифицированы либо статус редакции явно отделён от содержания нормы"
      - "scope правила определён"
      - "нет неразрешённого конфликта"
  otherwise: reserve_unverified

verification_semantics:
  - "Открытая карточка документа может подтверждать только реквизиты/статус, но не содержание пункта."
  - "Наличие ссылки на таблицу или приложение без чтения этой таблицы/приложения не подтверждает числовую норму."
  - "Прочтение одного пункта не делает весь документ verified_current по содержанию; подтверждение гранулярное."
  - "Если браузер/коннектор вернул No content available или только заголовок, правило остаётся needs_recheck."

forbidden:
  - "цепочка доверия A1 → внешний сайт → второй внешний сайт"
  - "подтверждение численной нормы одним вторичным сайтом"
  - "подмена точного пункта общим названием документа"
  - "автоматическое признание новой редакции применимой без проверки"
  - "маркировка source_exact только по названию/карточке документа"
