<!doctype html><html lang="ru"><head><meta charset="utf-8"><style>
body{font:14px Segoe UI,sans-serif;background:#f5f5f5;color:#202020;margin:0;padding:16px}
.card{background:white;border:1px solid #d6d6d6;border-radius:8px;padding:14px}
h1{font-size:18px;margin:0 0 12px}.row{margin:8px 0}.label{color:#666;font-size:12px}
.value{font-size:15px}.enum{display:block;color:#777;font-size:11px;margin-top:2px}
.status{padding:8px;border-radius:5px;background:#eef3f8;font-weight:600}
.unknown{background:#fff0cf;color:#714b00}.buttons{display:flex;gap:7px;margin-top:14px}
button{flex:1;padding:8px 4px;border:1px solid #aaa;border-radius:5px;background:#fff;cursor:pointer}
button small{display:block;color:#666}.error{color:#a40000;font-size:12px;margin-top:8px}
</style></head><body><div class="card"><h1>Safe BIM</h1>
<div class="row"><div class="label">Задача <span class="enum">Task</span></div><div id="task" class="value">—</div></div>
<div class="row"><div class="label">Текущий шаг <span class="enum">Current step</span></div><div id="step" class="value">—</div><span id="progress" class="enum">0 из 0</span></div>
<div class="row"><span class="label">Этаж / Floor: </span><span id="floor">—</span></div>
<div class="row"><span class="label">Read-back: </span><span id="readback">—</span></div>
<div id="status" class="status">Ожидание<span class="enum">PENDING</span></div>
<div class="buttons"><button disabled onclick="act('continue')">Продолжить<small>Continue</small></button><button disabled onclick="act('pause')">Пауза<small>Pause</small></button><button disabled onclick="act('stop')">Стоп<small>Stop</small></button></div>
<div id="error" class="error"></div></div><script>
const base=location.protocol==='http:'&&['127.0.0.1','localhost'].includes(location.hostname)?location.origin:'http://127.0.0.1:19731';
const q=new URLSearchParams(location.search); const selected=q.get('job_id')||'active';
let displayed=null, serial=0, rendered=0;
const labels={PENDING:'Ожидание',RUNNING:'Выполняется',DONE:'Готово',FAILED:'Ошибка',WAITING_USER:'Ожидание пользователя',UNKNOWN_OUTCOME:'Результат неизвестен',PAUSED:'Приостановлено',CANCELLED:'Остановлено'};
const buttons=[...document.querySelectorAll('button')];
function disable(){buttons.forEach(b=>b.disabled=true);displayed=null;}
async function refresh(){const ticket=++serial;try{
 const r=await fetch(`${base}/state?job_id=${encodeURIComponent(selected)}`,{cache:'no-store'}); const s=await r.json();
 if(ticket<rendered)return;rendered=ticket;
 if(!r.ok||!s.job_id||!Number.isInteger(s.revision)||!s.capability||!s.controls)throw Error(s.error||'Invalid state');
 if(selected!=='active'&&s.job_id!==selected)throw Error('Wrong job');
 disable();for(const k of ['task','step','progress','floor','readback'])document.getElementById(k).textContent=s[k]??'—';
 document.getElementById('status').textContent=`${labels[s.status]||s.status} / ${s.enum}`;
 displayed=s;
 if(!['DONE','FAILED','CANCELLED'].includes(s.status))['continue','pause','stop'].forEach((a,i)=>buttons[i].disabled=s.controls[a]!==true);
 document.getElementById('error').textContent='';
 }catch(e){if(ticket<rendered)return;rendered=ticket;disable();document.getElementById('error').textContent='Controls disabled: '+e.message+'. Use the native controller or http://127.0.0.1:19731/palette (same-origin).';}}
async function act(action){const state=displayed;if(!state||!state.controls[action])return;disable();
 try{const r=await fetch(`${base}/jobs/${encodeURIComponent(state.job_id)}/${action}`,{method:'POST',headers:{'Content-Type':'application/json','X-Safe-BIM-Token':state.capability},body:JSON.stringify({job_id:state.job_id,action,revision:state.revision})});
 if(!r.ok)throw Error('Command not confirmed; no automatic retry');
 }catch(e){document.getElementById('error').textContent=e.message;}finally{await refresh();}}
refresh();setInterval(refresh,1000);
</script></body></html>
